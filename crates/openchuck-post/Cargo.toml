# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "openchuck-post"
description = "Reusable post-processing library: neutral toolpath IR to G-code through user-editable post definitions."
readme = "README.md"
keywords = ["cam", "cnc", "g-code", "post-processor", "4-axis"]
categories = ["science"]
# What the published crate holds (OI-302, decision 0138): the library and the files it reads.
# The tests stay out: they read the repository's testdata/ and the unpublished openchuck-testkit.
include = ["/src/**", "/posts/**", "/README.md", "/CHANGELOG.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
openchuck-types.workspace = true
serde.workspace = true
thiserror.workspace = true
minijinja.workspace = true
toml.workspace = true

[dev-dependencies]
openchuck-testkit.workspace = true

[lints]
workspace = true

# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "openchuck-import"
description = "Model and curve readers behind a ModelImporter trait: STL, STEP (the C++ kernel is wrapped here and nowhere else)."
readme = "README.md"
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Builds the OpenCASCADE wrapper and the `openchuck-step-worker` program (decision
# 0003). Off by default so the rest of the workspace needs no C++ toolchain; the
# first build of the kernel takes 8 to 71 minutes.
kernel = ["dep:cc", "dep:occt-sys"]

[[bin]]
name = "openchuck-step-worker"
path = "src/bin/openchuck-step-worker.rs"
required-features = ["kernel"]

[[example]]
name = "step_mutations"
required-features = ["kernel"]

[dependencies]
openchuck-types.workspace = true
openchuck-geom.workspace = true
serde.workspace = true
serde_json.workspace = true
stl_io.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = { workspace = true, optional = true }
occt-sys = { workspace = true, optional = true }

[dev-dependencies]
openchuck-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true

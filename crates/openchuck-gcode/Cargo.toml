# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "openchuck-gcode"
description = "G-code reader and interpreter: parses G-code with A words back into motion for replay and checks."
readme = "README.md"
keywords = ["cnc", "g-code", "gcode", "parser", "linuxcnc"]
categories = ["science", "parser-implementations"]
# What the published crate holds (OI-302, decision 0138): the library and the files it reads.
# The tests stay out: they read the repository's testdata/ and the unpublished openchuck-testkit.
include = ["/src/**", "/README.md", "/CHANGELOG.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
openchuck-types.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

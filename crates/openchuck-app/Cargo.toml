# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "openchuck-app"
description = "OpenChuckCAM application layer: commands, queries, events, job manager and operation pipeline. UI-agnostic."
readme = "README.md"
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The integration tests are one binary (tests/integration.rs, decision 0516, option C);
# the files behind the `kernel-tests` feature stay one binary each, as the STEP kernel
# job runs them by name.
autotests = false

[features]
# Tests that compare the library's exact evaluators with OpenCASCADE itself (decision 0017, 0027).
# They need the C++ kernel, so they are off by default.
kernel-tests = ["openchuck-import/kernel"]

# The STEP accuracy measurement of lane STEPALL-M (decision 0211): it reads
# STEP files, so it needs the kernel.
[[example]]
name = "step_accuracy"
path = "examples/step_accuracy/main.rs"
required-features = ["kernel-tests"]

# Pencil clean-up's creases on a STEP part, measured (lane STEPALL-P,
# decision 0226): it reads STEP files, so it needs the kernel.
[[example]]
name = "pencil_creases"
required-features = ["kernel-tests"]

[[example]]
name = "swarf_tolerance"
required-features = ["kernel-tests"]

# How far swarf cuts into the floor below the faces it cuts, with and without
# the floor in an avoid set (lane SWARF-FLOOR, decision record 0491).
[[example]]
name = "swarf_floor"
required-features = ["kernel-tests"]

[[example]]
name = "swarf_ends"
required-features = ["kernel-tests"]

# The exact face and trim queries, measured for correctness and cost (lane
# STEPALL-X1, issue 348): it reads STEP files, so it needs the kernel.
[[example]]
name = "step_queries"
required-features = ["kernel-tests"]

[dependencies]
openchuck-types.workspace = true
openchuck-path.workspace = true
openchuck-post.workspace = true
openchuck-gcode.workspace = true
openchuck-geom.workspace = true
openchuck-import.workspace = true
openchuck-sim.workspace = true
openchuck-project.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
openchuck-testkit.workspace = true
rayon.workspace = true
proptest.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "brep_edges_step"
path = "tests/brep_edges_step.rs"

[[test]]
name = "step_accuracy"
path = "tests/step_accuracy.rs"

[[test]]
name = "step_drilling"
path = "tests/step_drilling.rs"

[[test]]
name = "step_exact"
path = "tests/step_exact.rs"

[[test]]
name = "step_pipeline"
path = "tests/step_pipeline.rs"

[[test]]
name = "step_queries"
path = "tests/step_queries.rs"

[[test]]
name = "step_selection"
path = "tests/step_selection.rs"

[[test]]
name = "step_strategies"
path = "tests/step_strategies.rs"

# Default tool set for the Makera Z1 (TL-11, TL-12; decision record 0081).
# Tool numbers are NXX: N a category (1 flat end, 2 ball, 3 V-bit, 4 chamfer,
# 5 drill), XX counting from 01 in the category. They are assigned by this
# project under the owner's decision, not read from Makera, and the owner may
# replace them. 4 mm and 6 mm shank tools continue each category's numbers.
schema = 1
machine = "Makera Z1"


# Default Makera Z1 tool, number 210 (TL-12; decision record 0081). Facts
# only: dimensions and parameters, no wording, images or file structures.
# Tool material "carbide" is the owner's decision, from the community
# profiles' material column.
# Cutting data (OI-270, owner-decided): spindle speed, plunge feed and depth
# of cut (stepdown) from the Tool Reference Parameters of the Makera bit
# page two-flute-ball-nose-bit-4mm-shank; feed per tooth = feed / (spindle
# speed x flute count); stepover diameter / 7 (community Fusion presets and
# FreeCAD bit files agree: Fusion360-profiles/Tool Files/Makera Ball
# Endmills.tools, Freecad/Tools/Bit/). Materials are the page's names; a
# dash on the page stores nothing.
# Source: bit page two-flute-ball-nose-bit-4mm-shank: diameter, flute length
# (variant sizes), shank 4, total length ~45, two flutes (name), solid
# carbide. Where the page lists several sizes beside several total lengths,
# the sizes are matched to the lengths by position (first size to first
# length); the community file agrees with every one; community file Makera
# Ball Endmills.csv agrees (ball end mill, overall length 45).
schema = 1
id = "c0de0001-0000-4000-8000-000000000210"
name = "Z1 ball 4x22"

[tool]
diameter = 4.0
flute_length = 22.0
overall_length = 45.0
shank_diameter = 4.0
flute_count = 2
material = "carbide"

[tool.shape]
type = "ball_end"

[cutting_data."Hardwood"]
spindle_speed = 12000.0
feed_per_tooth = 0.02083333333
plunge_feed = 200.0
stepover = 0.571429
stepdown = 1.0


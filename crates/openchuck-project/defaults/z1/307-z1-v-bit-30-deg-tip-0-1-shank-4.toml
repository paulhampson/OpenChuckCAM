# Default Makera Z1 tool, number 307 (TL-12; decision record 0081). Facts
# only: dimensions and parameters, no wording, images or file structures.
# Tool material "carbide" is the owner's decision, from the community
# profiles' material column.
# Cutting data (OI-270, owner-decided): spindle speed, plunge feed and depth
# of cut (stepdown) from the Tool Reference Parameters of the Makera bit
# page single-flute-engraving-bit-4mm-shank; feed per tooth = feed /
# (spindle speed x flute count); stepover as the community states it for
# this bit, an absolute value in mm (community Fusion presets and FreeCAD
# bit files agree: Fusion360-profiles/Tool Files/Makera Engraving
# Bits.tools, Freecad/Tools/Bit/; the VCarve database gives 70 percent of
# the tip diameter instead, which is not used). Materials are the page's
# names; a dash on the page stores nothing.
# Source: bit page single-flute-engraving-bit-4mm-shank: included angle and
# tip diameter (variant names and parameter row labels), shank 4, total
# length ~42, single flute (name), solid carbide; flute length 7 from the
# community profiles Carvera-Community/Carvera_Community_Profiles at
# 186e7b9, CAM_Post_Processors/Fusion360-profiles/Tool Files/csv/Makera
# Engraving Bits.csv only. The cutter diameter 3.85 is DERIVED, not stated
# by the page or the community files (they give 4, which a 30 degree cone
# from the tip cannot reach within the flute length): tip + 2 x flute length
# x tan 15 degrees, rounded down to 0.01 mm. If the real cutter diameter
# becomes known it should replace it (OI-283).
schema = 1
id = "c0de0001-0000-4000-8000-000000000307"
name = "Z1 V-bit 30 deg tip 0.1 shank 4"

[tool]
diameter = 3.85
flute_length = 7.0
overall_length = 42.0
shank_diameter = 4.0
flute_count = 1
material = "carbide"

[tool.shape]
type = "v_bit"
included_angle = 30.0
tip_diameter = 0.1

[cutting_data."Hardwood"]
spindle_speed = 12000.0
feed_per_tooth = 0.08333333333
plunge_feed = 500.0
stepover = 0.03
stepdown = 1.0

[cutting_data."Plastic"]
spindle_speed = 12000.0
feed_per_tooth = 0.08333333333
plunge_feed = 500.0
stepover = 0.03
stepdown = 1.0

[cutting_data."Softwood"]
spindle_speed = 12000.0
feed_per_tooth = 0.08333333333
plunge_feed = 500.0
stepover = 0.03
stepdown = 2.0

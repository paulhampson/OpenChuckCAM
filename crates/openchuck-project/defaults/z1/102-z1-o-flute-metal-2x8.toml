# Default Makera Z1 tool, number 102 (TL-12; decision record 0081). Facts
# only: dimensions and parameters, no wording, images or file structures.
# Tool material "carbide" is the owner's decision, from the community
# profiles' material column.
# Cutting data (OI-270, owner-decided): spindle speed, plunge feed and depth
# of cut (stepdown) from the Tool Reference Parameters of the Makera bit
# page spiral-o-single-flute-bit-for-metal-1-8-shank; feed per tooth = feed
# / (spindle speed x flute count); stepover 70 percent of the diameter, from
# the VCarve database VCarveDesktop-profiles/CarveraTools.vtdb, the only
# community file that states a stepover for this bit; its rows are for the
# material Hardwood/Plastic and the value is applied to every material the
# page has data for (owner's decision to combine the sources). Materials are
# the page's names; a dash on the page stores nothing.
# Source: bit page spiral-o-single-flute-bit-for-metal-1-8-shank: diameter,
# flute length (variant sizes), shank 3.175, length ~38, flute count 1
# (single flute), solid carbide; set page Essential Milling Bit Set agrees;
# community file Makera O Flute Bits.csv agrees (flat end mill, overall
# length 38).
schema = 1
id = "c0de0001-0000-4000-8000-000000000102"
name = "Z1 O-flute metal 2x8"

[tool]
diameter = 2.0
flute_length = 8.0
overall_length = 38.0
shank_diameter = 3.175
flute_count = 1
material = "carbide"

[tool.shape]
type = "flat_end"

[cutting_data."Aluminum"]
spindle_speed = 12000.0
feed_per_tooth = 0.04166666667
plunge_feed = 200.0
stepover = 1.4
stepdown = 0.15

[cutting_data."Brass"]

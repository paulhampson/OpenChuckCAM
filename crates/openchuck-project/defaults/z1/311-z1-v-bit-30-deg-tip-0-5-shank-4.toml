# Default Makera Z1 tool, number 311 (TL-12; decision record 0081). Facts
# only: dimensions and parameters, no wording, images or file structures.
# Tool material "carbide" is the owner's decision, from the community
# profiles' material column.
# Cutting data (OI-270, owner-decided): spindle speed, plunge feed and depth
# of cut (stepdown) from the Tool Reference Parameters of the Makera bit
# page single-flute-engraving-bit-4mm-shank; feed per tooth = feed /
# (spindle speed x flute count); stepover as the community states it for
# this bit, an absolute value in mm (community Fusion presets and FreeCAD
# bit files agree: Fusion360-profiles/Tool Files/Makera Engraving
# Bits.tools, Freecad/Tools/Bit/; the VCarve database gives 70 percent of
# the tip diameter instead, which is not used). Materials are the page's
# names; a dash on the page stores nothing.
# Source: bit page single-flute-engraving-bit-4mm-shank: included angle and
# tip diameter (variant names and parameter row labels), shank 4, total
# length ~42, single flute (name), solid carbide; cutter diameter 4 and
# flute length 7 from the community profiles Carvera-
# Community/Carvera_Community_Profiles at 186e7b9,
# CAM_Post_Processors/Fusion360-profiles/Tool Files/csv/Makera Engraving
# Bits.csv only.

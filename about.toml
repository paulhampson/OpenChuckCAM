# cargo-about configuration: the licence notices shipped with binaries (NFR-10).
# Generate with: cargo about generate about.hbs > THIRD-PARTY-NOTICES.html
accepted = [
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }

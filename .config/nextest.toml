#
# Long-running tests (AGENTS.md, "Long-running tests"). A test that takes more
# than about a minute uninstrumented is listed in both profiles below, as the
# exclusion in `coverage` and the selection in `long`; the two lists must match.
#
# - The pull request Tests job runs everything (the default profile) except one
#   test, below.
# - The Coverage trend job uses `--profile coverage`, which leaves the long tests
#   out: instrumentation slows the hot loops 6 to 11 times and a single test
#   cannot be split across cores.
# - The nightly run uses `--profile long`, which runs only the long tests,
#   uninstrumented.
#
# Times on a 4-core machine in a full `cargo nextest run` (16 Oct 2026, decision
# 0052, OI-223 and OI-224), where the long tests share the cores with the rest:
# 318 s, 309 s, 197 s, 171 s, 138 s, 113 s, 113 s, 91 s, 89 s, 79 s and 77 s. Run
# alone on one test thread they take 104 s, 182 s, 66 s, 54 s, 55 s, 33 s, 71 s,
# 30 s, 27 s, 21 s and 24 s: contention roughly doubles a test's time, so the list
# follows the full-run time, which is what the Tests and Coverage jobs pay. The
# first filter also selects slice 13's `req_op_12_the_independent_checker_finds_no_gouge_on_the_reference_parts`
# (simultaneous finishing; decision 0036) and the helical oracle-parts test of the
# same prefix. The `reference_jobs_are_identical_at_1_and_n_threads` filter also
# selects slice 21c's `cone_held_tabs` (81 s when it was listed).
#
# Lane TE (decision 0096, 17 Oct 2026, 4 cores): of the command-line end-to-end tests
# in `apps/openchuck-cli/tests/e2e.rs`, the `lobed` sample's end-to-end test (1, 2 and
# N threads with both posts) takes 117 s and its simulation 63 s in a full
# `cargo nextest run -p openchuck-cli` (103 s and 55 s alone on one test thread); every
# other test there is under 45 s.
#
# Lane FIT (decision 0133, 19 Oct 2026, 8 vCPU): simultaneous finishing's fitter now
# tests the quarter points too, so every test of `openchuck-path::simultaneous` that
# generates a path takes about twice as long (alone on one thread: the checker test
# 86 s to 203 s, the contact feed 53 s to 112 s, the tilt bound 27 s to 58 s). Four more
# cross a minute in a full `cargo nextest run -p openchuck-path` and are listed below:
# every tool profile on the lobed part 176 s, the path of a surface of revolution 113 s,
# the axial passes 73 s and the 1, 2 and N threads test 70 s (alone: 27, 22, 17 and
# 14 s).

# Lane GATES (OI-913, 22 Oct 2026): the `lobed` sample's committed-project test (the
# folder in `testdata/projects/` with its part generated, validated, then regenerated
# with both posts and compared with the golden programs) takes 77 s in
# `cargo test -p openchuck-cli --test e2e -- committed_project` (8 vCPU, beside the
# other seven, each under 30 s).
# The gate 5 first-cut project (decision 0221, OI-914), alone on 8 vCPU: its committed
# project regenerated at 1, 2 and N threads with both posts (six runs of rotary roughing
# on 35 x 35 mm box stock and helical finishing) 387 s, and its simulation 98 s.

# The first exception to "the pull request Tests job runs every listed test" (OI-506,
# owner, 20 Oct 2026, option C of the FIT flag; AGENTS.md: "accept it in the nightly run
# only"): `req_op_12_the_independent_checker_finds_no_gouge_on_the_reference_parts`
# took 624.9 s on the macOS runner and 597.6 s on Windows shard 2 in the contended pull
# request run after decision 0133 (203 s alone), so the default profile leaves it out.
# It stays in the `long` profile (the nightly run) and in `coverage-full`, which sets
# `default-filter = 'all()'` so that the nightly Coverage run still counts it. Only this
# test is excepted; the filter names it exactly, so the helical oracle-parts test of the
# same prefix still runs in the pull request. `cargo nextest run -p openchuck-path -E
# 'test(=req_op_12_the_independent_checker_finds_no_gouge_on_the_reference_parts)'`
# does not select it either: run it with `--profile long`.
[profile.default]
default-filter = 'not test(=req_op_12_the_independent_checker_finds_no_gouge_on_the_reference_parts)'

# The STEP kernel tests run only with `--features kernel-tests`, in CI's STEP
# kernel job (not in the Tests, Coverage or nightly long runs), so their entry
# below documents the time and selects nothing elsewhere: roughing then rest
# machining of the cylinder and the filleted box with pencil clean-up on the
# exact STEP parts took 147 s alone (lane F, 17 Oct 2026, decision 0076; the
# filleted box was added back for OI-236).

# The nightly Coverage run (decision 0102, `coverage.yml`): every test, instrumented, so the figures
# are for the whole suite. Nothing is left out, so the order decides the run time. Instrumentation
# makes the long tests 6 to 11 times slower, and one test cannot be split across cores: the longest
# alone may take 18 to 33 minutes (estimate from the uninstrumented time alone, 182 s; the first
# nightly run is the first measurement). So the long tests start first, longest first by their time
# in a full uninstrumented run (17 Oct 2026), then the six next-slowest tests (132 to 241 s
# instrumented in Coverage run 39031169050, 40 to 59 s uninstrumented), so that no test runs alone
# at the end. `priority` changes the order only: the set of tests is the default profile's. Each
# filter names its binary and test exactly, so nothing else is caught.
[profile.coverage-full]
default-filter = 'all()'

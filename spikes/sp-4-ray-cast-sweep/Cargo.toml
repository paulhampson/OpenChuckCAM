#
# SP-4 spike (work breakdown, Spikes): is continuous 4-axis feasible with
# parry3d-f64 ray casts swept around the A axis? Throwaway code under the spike
# rules: never a workspace member and never a product dependency. The empty
# [workspace] keeps it out of the root workspace.

[package]
name = "sp4-ray-cast-sweep"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
parry3d-f64 = "=0.31.1"

[profile.test]
opt-level = 3

[profile.release]
debug = "line-tables-only"

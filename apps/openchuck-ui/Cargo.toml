# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "openchuck-ui"
description = "OpenChuckCAM desktop application (egui). Talks only to openchuck-app and openchuck-viewport."
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
openchuck-app.workspace = true
openchuck-buildinfo.workspace = true
openchuck-viewport.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
log.workspace = true

# The parent console of a Windows release build (decision record 0155).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The OS clipboard test (decision 0493) uses the backend eframe hands copied text to. It adds no
# features of its own, so it sees the clipboard only if the eframe workspace line enables it.
[dev-dependencies]
egui-winit.workspace = true

[lints]
workspace = true

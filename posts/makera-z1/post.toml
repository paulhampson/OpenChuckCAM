# Makera Z1 post (GC-09). Every convention is derived from Makera's profiles and the Z1
# firmware source (decision 0007) and is unconfirmed until the attended air cut (OI-37):
# right-handed A about +X, programs in G54 with Y0 Z0 on the A axis, no G93 (the stock
# firmware ignores it), the Makera feed rule, whole turns dropped with G92.4 A0 S0,
# no line numbers, comments on their own line, three decimals.
# Generated G-code is the user's to verify before running (NFR-12).
schema = 1
name = "Makera Z1"
template = "main.post"
feed_rule = "makera"

[options]
units = "mm"
a_letter = "A"
a_direction = "same"
unwind = "drop_turns"
unwind_command = "G92.4 A0 S0"
header = ["G90 G21 G17"]
footer = ["M5", "G53 G0 Z-3", "G28", "M2"]
work_offset = "G54"
coolant = "off"
max_feed = 1200.0
feed_mode = "g94"
comments = true
file_extension = "nc"

[options.tool_change]
stop_spindle_first = true
length_offset = false

[options.line_numbers]
enabled = false
start = 10
step = 10

[options.decimals]
pos = 3
a = 3
f = 1

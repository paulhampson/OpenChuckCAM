# OpenChuckCAM user guide, mdBook prototype (lane DOCSITE, throwaway branch).
[book]
title = "OpenChuckCAM user guide"
language = "en"
description = "How to use OpenChuckCAM to make G-code for 4-axis rotary machining."

[output.html]
theme = "theme"
default-theme = "light"
preferred-dark-theme = "light"
smart-punctuation = true
definition-lists = true
admonitions = true
no-section-label = true
mathjax-support = false
additional-css = []
additional-js = []

[output.html.playground]
runnable = false
copyable = false

[output.html.fold]
enable = false

[output.html.print]
enable = true

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
copy-js = true

{% extends "base.html" %}
{% block title %}{{ section.title }} - {{ config.title }}{% endblock %}
{% block content %}<h1>{{ section.title }}</h1>
{{ section.content | safe }}{% endblock %}
{% block pager %}{% if section.pages %}<nav class="pager" aria-label="Previous and next page"><a class="next" rel="next" href="{{ section.pages[0].permalink }}"><span>Next</span>{{ section.pages[0].title }}</a></nav>{% endif %}{% endblock %}

#
# The message rules' baseline (decision record 0536 item 6.3; `cargo xtask messages`,
# also run by `cargo xtask deps`). Each count is a ceiling that only falls: a file may
# not have more than its count, and a file that has fewer must lower it.
#
# [message_new]: messages built with `Message::new` outside `Message::about`, per file.
# Decision 0536 build steps 3 to 5 moved them to `Message::about`; step 4 reached zero
# and made `Message::new` private, so the table is empty and stays empty.
#
# [claims]: uses of a word that claims safety ("verified", "certified", "ready to run" and
# the others of `CLAIMS` in xtask/src/messages.rs) in a product file's string literals
# (NFR-12; interface specification section 15). Build step 5 reworded the last of them
# (OI-2097), so the table is empty and stays empty: no product text may use one.
#
# [strategy_refusals]: refusals in the path crate made with a variant that carries no
# topic (`PathError::Strategy`, `Surface`, `Region`, `RotaryLimit`), per file (decision
# record 0644; checked by `cargo xtask deps`' topics check). A refusal names its check
# with `PathError::refused(topic::..., ...)`. Decision 0644 moved every strategy refusal;
# what is left is the geometry's own `Surface`, `Region` and `RotaryLimit` errors, which
# the application shows under the topics Surface, Region and Rotary axis, and the
# registry's two errors in strategy.rs, which no user sees.

[message_new]

[claims]

[strategy_refusals]
"crates/openchuck-path/src/brep.rs" = 4
"crates/openchuck-path/src/brep_edges.rs" = 3
"crates/openchuck-path/src/curves.rs" = 4
"crates/openchuck-path/src/drill.rs" = 1
"crates/openchuck-path/src/region.rs" = 2
"crates/openchuck-path/src/rotary.rs" = 2
"crates/openchuck-path/src/solid.rs" = 4
"crates/openchuck-path/src/strategy.rs" = 2
"crates/openchuck-path/src/surface.rs" = 3
"crates/openchuck-path/src/unroll.rs" = 19

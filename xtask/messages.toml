#
# The message rules' baseline (decision record 0536 item 6.3; `cargo xtask messages`,
# also run by `cargo xtask deps`). Each count is a ceiling that only falls: a file may
# not have more than its count, and a file that has fewer must lower it.
#
# [message_new]: messages built with `Message::new` outside `Message::about`, per file.
# Decision 0536 build steps 3 to 5 move them to `Message::about`; at zero, `Message::new`
# becomes private.
#
# [claims]: uses of a word that claims safety ("verified", "certified", "ready to run" and
# the others of `CLAIMS` in xtask/src/messages.rs) in a product file's string literals
# (NFR-12; interface specification section 15). The texts listed are reworded in build
# step 5 (OI-2097); some are internal refusal texts of the Facing check.

[message_new]
"apps/openchuck-ui/src/shell/checkpoints.rs" = 1
"crates/openchuck-app/src/overview.rs" = 25

[claims]
"apps/openchuck-ui/src/results_panel.rs" = 1
"crates/openchuck-app/src/facing/display.rs" = 2
"crates/openchuck-app/src/facing/written.rs" = 4
"crates/openchuck-app/src/operation.rs" = 1
"crates/openchuck-app/src/overview.rs" = 1
"crates/openchuck-app/src/posting.rs" = 1
"crates/openchuck-path/src/facing/validation.rs" = 1
"crates/openchuck-path/src/facing/validation/end_layers.rs" = 1
"crates/openchuck-path/src/facing/validation/legacy.rs" = 1

#
# The message rules' baseline (decision record 0536 item 6.3; `cargo xtask messages`,
# also run by `cargo xtask deps`). Each count is a ceiling that only falls: a file may
# not have more than its count, and a file that has fewer must lower it.
#
# [message_new]: messages built with `Message::new` outside `Message::about`, per file.
# Decision 0536 build steps 3 to 5 moved them to `Message::about`; step 4 reached zero
# and made `Message::new` private, so the table is empty and stays empty.
#
# [claims]: uses of a word that claims safety ("verified", "certified", "ready to run" and
# the others of `CLAIMS` in xtask/src/messages.rs) in a product file's string literals
# (NFR-12; interface specification section 15). Build step 5 reworded the last of them
# (OI-2097), so the table is empty and stays empty: no product text may use one.
#
# [ids]: references to a requirement ("(OP-14)"), a decision record ("decision 0495") or an
# open item ("OI-360") in a product file's string literals (decision record 0644, after
# OWNERCHECKS2). A user reads what to change, not where the rule came from. What is left is
# not a message: the frame-time benchmark's own labels, the default tools file's header and
# the determinism checker's test-support panic.
#
# [strategy_refusals]: refusals in the path crate made with a variant that carries no
# topic (`PathError::Strategy`, `Surface`, `Region`, `RotaryLimit`), per file (decision
# record 0644; checked by `cargo xtask deps`' topics check). A refusal names its check
# with `PathError::refused(topic::..., ...)`. Decision 0644 moved every strategy refusal;
# what is left is the geometry's own `Surface`, `Region` and `RotaryLimit` errors, which
# the application shows under the topics Surface, Region and Rotary axis, and the
# registry's two errors in strategy.rs, which no user sees.

[message_new]

[claims]

[ids]
"apps/openchuck-ui/src/bench.rs" = 2
"crates/openchuck-project/src/tools/defaults.rs" = 1
"crates/openchuck-testkit/src/determinism.rs" = 1

[strategy_refusals]
"crates/openchuck-path/src/brep.rs" = 4
"crates/openchuck-path/src/brep_edges.rs" = 3
"crates/openchuck-path/src/curves.rs" = 4
"crates/openchuck-path/src/drill.rs" = 1
"crates/openchuck-path/src/region.rs" = 2
"crates/openchuck-path/src/rotary.rs" = 2
"crates/openchuck-path/src/solid.rs" = 4
"crates/openchuck-path/src/strategy.rs" = 2
"crates/openchuck-path/src/surface.rs" = 3
"crates/openchuck-path/src/unroll.rs" = 19

# [plural_counts]: a format placeholder straight before a plural noun ("{layers} layers",
# "{} moves") in a product file's string literals (decision record 0644, after OWNERCHECKS2
# read "in 1 layers of 1 mm"). A count that can be one is written with
# `openchuck_path::counted`, which gives "1 layer" and "3 layers". What is left is never one:
# refusals for a count that is too many, a branch that runs only for two or more ("{} entries
# start higher", a long pass list, "Copied {n} models"), a mesh's, a G-code file's or a drawn
# path's own size, the points sampled on a part and a configured limit of points, the word
# "turns" as a verb or a fractional number of turns, a selection set's role name, and the
# action log's internal line. The count only falls.

[plural_counts]
"apps/openchuck-cli/src/main.rs" = 1
"apps/openchuck-ui/src/export_panel.rs" = 1
"apps/openchuck-ui/src/export_panel/preview.rs" = 1
"apps/openchuck-ui/src/playback_panel.rs" = 2
"apps/openchuck-ui/src/shell.rs" = 2
"crates/openchuck-app/src/action_log.rs" = 1
"crates/openchuck-app/src/note_groups.rs" = 1
"crates/openchuck-app/src/selection.rs" = 1
"crates/openchuck-path/src/adaptive.rs" = 1
"crates/openchuck-path/src/assemble.rs" = 4
"crates/openchuck-path/src/assemble/entry.rs" = 7
"crates/openchuck-path/src/assemble/lead.rs" = 1

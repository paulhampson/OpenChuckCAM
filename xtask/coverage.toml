#
# Configuration for `cargo xtask coverage`: line coverage per crate against the
# development target (verification plan section 8, decision 0102). The Coverage
# workflow (`.github/workflows/coverage.yml`) runs it on the lcov file of every
# nightly run, which is the whole suite.

# Line coverage, in percent, that every gated crate should reach.
target = 95.0

# While false, a run reports the table and fails only on a configuration
# problem (a crate that is not listed here, or a gated crate with no data). Set it to
# true after the first measurement has been read, with a floor below for each crate
# that is under the target.
enforce = false

# Crates that must reach their threshold: the library family and the application logic.
gated = [
    "openchuck-types",
    "openchuck-geom",
    "openchuck-path",
    "openchuck-sim",
    "openchuck-post",
    "openchuck-gcode",
    "openchuck-project",
    "openchuck-import",
    "openchuck-app",
]

# Reported, never failing: the GPU and windowing code the headless run cannot reach, and
# the command-line wiring.
report_only = ["openchuck-ui", "openchuck-viewport", "openchuck-cli"]

# Left out of the report: test support code. (xtask is kept out of the lcov file by the
# Coverage job itself.)
excluded = ["openchuck-testkit"]

# A temporary threshold for a gated crate that is under the target, in percent, set from
# the first measurement. The nightly run fails when the crate falls below its floor.
[floors]

#
# Headless LinuxCNC 2.9 simulator for gate 3 (verification plan section 6, slice 6 item 9):
# trivkins XYZA, mm, exact stop (G61). Axis limits are a verification envelope around the
# rotary axis in work coordinates (Z0 and Y0 on the axis), wide enough for the safe Z; the
# real machine's travel is checked by gate 1. trivkins treats A as a plain number.
# Velocities follow Makera's Fusion machine file for the Z1: 4000 mm/min linear, 21600 deg/min A.
# Accelerations are set high so cruise time dominates; they are not the Z1's.
[EMC]
VERSION = 1.1
MACHINE = OpenChuckCAM gate 3: XYZA trivkins sim
[DISPLAY]
DISPLAY = ./sim_driver.py
[TASK]
TASK = milltask
CYCLE_TIME = 0.001
[RS274NGC]
PARAMETER_FILE = sim.var
RS274NGC_STARTUP_CODE = G21 G90 G17 G61
[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = sim.tbl
[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
[HAL]
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange -no_simulated_home
[TRAJ]
COORDINATES = XYZA
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 66.667
DEFAULT_LINEAR_VELOCITY = 10
[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XYZA
[AXIS_X]
MIN_LIMIT = -20
MAX_LIMIT = 250
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 3000
[AXIS_Y]
MIN_LIMIT = -150
MAX_LIMIT = 150
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 3000
[AXIS_Z]
MIN_LIMIT = -80
MAX_LIMIT = 80
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 3000
[AXIS_A]
MIN_LIMIT = -1e9
MAX_LIMIT = 1e9
MAX_VELOCITY = 360
MAX_ACCELERATION = 30000
[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -20
MAX_LIMIT = 250
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 3000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME = 0
[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -150
MAX_LIMIT = 150
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 3000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME = 0
[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -80
MAX_LIMIT = 80
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 3000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME = 0
[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -1e9
MAX_LIMIT = 1e9
MAX_VELOCITY = 360
MAX_ACCELERATION = 30000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME = 0

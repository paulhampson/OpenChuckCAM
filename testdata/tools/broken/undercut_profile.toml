# The custom profile turns back (an undercut) at segment 2.
schema = 1
id = "0d6b8a5e-3c1f-4e2a-9b7d-000000000008"
name = "Corner rounder r2"

[tool]
diameter = 6.0
flute_length = 10.0
overall_length = 50.0
shank_diameter = 6.0
flute_count = 2

[tool.shape]
type = "custom"

[[tool.shape.profile.segments]]
type = "line"
to = { radius = 1.0, height = 0.0 }

[[tool.shape.profile.segments]]
type = "line"
to = { radius = 0.5, height = 2.0 }

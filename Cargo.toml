# SPDX-License-Identifier: AGPL-3.0-or-later
#
# OpenChuckCAM workspace (architecture section 12). Every third-party version is
# declared once in [workspace.dependencies] with an exact pin, and each entry has
# an NFR-14 record in docs/dependencies.md.

[workspace]
resolver = "3"
members = [
    "crates/openchuck-types",
    "crates/openchuck-path",
    "crates/openchuck-post",
    "crates/openchuck-gcode",
    "crates/openchuck-geom",
    "crates/openchuck-import",
    "crates/openchuck-sim",
    "crates/openchuck-project",
    "crates/openchuck-app",
    "crates/openchuck-viewport",
    "crates/openchuck-testkit",
    "crates/openchuck-buildinfo",
    "apps/openchuck-cli",
    "apps/openchuck-ui",
    "benches",
    "xtask",
]
# The fuzz targets need a nightly toolchain and live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
# The four library-family crates share this version before 1.0 (architecture section 12).
version = "0.34.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/paulhampson/OpenChuckCAM"
authors = ["OpenChuckCAM contributors"]

[workspace.dependencies]
# Project crates. Path dependencies carry a version so `cargo publish` works unchanged, except
# the test-only `openchuck-testkit` (never published): with no version, cargo leaves the
# dev-dependency out of a published manifest (decision 0103, OI-302).
openchuck-types = { path = "crates/openchuck-types", version = "0.34.0" }
openchuck-path = { path = "crates/openchuck-path", version = "0.34.0" }
openchuck-post = { path = "crates/openchuck-post", version = "0.34.0" }
openchuck-gcode = { path = "crates/openchuck-gcode", version = "0.34.0" }
openchuck-geom = { path = "crates/openchuck-geom", version = "0.34.0" }
openchuck-import = { path = "crates/openchuck-import", version = "0.34.0" }
openchuck-sim = { path = "crates/openchuck-sim", version = "0.34.0" }
openchuck-project = { path = "crates/openchuck-project", version = "0.34.0" }
openchuck-app = { path = "crates/openchuck-app", version = "0.34.0" }
openchuck-viewport = { path = "crates/openchuck-viewport", version = "0.34.0" }
openchuck-testkit = { path = "crates/openchuck-testkit" }
openchuck-buildinfo = { path = "crates/openchuck-buildinfo", version = "0.34.0" }

# Third-party crates, exact pins (work breakdown slice 0 item 12).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
rayon = "=1.12.0"
blake3 = "=1.8.7"
sha2 = "=0.10.9"
uuid = { version = "=1.29.0", features = ["v4"] }
clap = { version = "=4.6.7", features = ["derive"] }
cargo_metadata = "=0.23.1"
toml = "=1.1.8"
# Post templates (decision record 0019); `openchuck-post` only. `fuel` needs `multi_template`.
minijinja = { version = "=3.0.3", default-features = false, features = ["builtins", "macros", "multi_template", "debug", "fuel", "serde"] }
stl_io = "=0.11.0"
# The STEP kernel (decision record 0003): occt-sys builds OpenCASCADE 7.8.1 (build
# dependency of openchuck-import only, feature `kernel`); cc compiles our C ABI wrapper.
occt-sys = "=7.8.1"
cc = "=1.10.0"
# 2D offsets on the unrolled development (decision record 0016; i_overlay is
# declared with its first use, slice 12).
cavalier_contours = "=0.9.0"
# Geometry queries behind our own types (decision records 0002 and 0015); no
# `spade` (triangulation), which the pathing core does not use.
parry3d-f64 = { version = "=0.31.1", default-features = false, features = ["std", "alloc", "dim3", "f64"] }
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = { version = "=0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
wgpu = "=30.0.1"
# Native open and save dialogs, `openchuck-ui` only (decision record 0029 item 15, OI-127).
rfd = "=0.17.2"
log = "=0.4.34"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_System_Console", "Win32_System_SystemInformation"] }

# Test, golden-file and benchmark crates (dev-dependencies only).
proptest = "=1.12.0"
insta = { version = "=1.49.0", features = ["json"] }
assert_cmd = "=2.2.2"
criterion = "=0.8.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# NFR-07 and architecture section 8: no unwrap, panic or unchecked indexing in
# library code. Tests are exempt through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
float_cmp = "warn"

# The pathing tests drop tools and check gouges on meshes of a few hundred
# thousand triangles; unoptimised they take minutes. Optimise the crates on
# that path in test and debug builds (decision record 0018).
[profile.dev.package.openchuck-path]
opt-level = 3
# The simulation sweeps millions of column-tool spans (decision record 0025).
[profile.dev.package.openchuck-sim]
opt-level = 3
[profile.dev.package.openchuck-testkit]
opt-level = 3
# The edge picker builds a hierarchy over hundreds of thousands of segments
# and the pick budget is timed in tests (OI-243).
[profile.dev.package.openchuck-geom]
opt-level = 3
[profile.dev.package.parry3d-f64]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3
[profile.dev.package.cavalier_contours]
opt-level = 3
[profile.dev.package.static_aabb2d_index]
opt-level = 3

[profile.release]
debug = "line-tables-only"

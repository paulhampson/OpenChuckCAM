<svg xmlns="http://www.w3.org/2000/svg" width="860" height="550" viewBox="0 0 860 550" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img">
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<title>Steps between rings: Sharp today against Blended</title>
<rect x="0" y="0" width="860" height="550" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<text x="70.0" y="30.0" fill="#222222" text-anchor="start" font-size="14" font-weight="bold" font-style="normal">Sharp (today): Steps between rings = Sharp</text>
<line x1="70.0" y1="60.0" x2="710.0" y2="60.0" stroke="#222222" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="710.0" y="52.0" fill="#222222" text-anchor="end" font-size="12" font-weight="normal" font-style="normal">A, degrees from the Start angle (not wrapped)</text>
<line x1="70.0" y1="60.0" x2="70.0" y2="235.0" stroke="#222222" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="64.0" y="249.0" fill="#222222" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">X along the part</text>
<text x="62.0" y="104.0" fill="#222222" text-anchor="end" font-size="13" font-weight="normal" font-style="normal">x_k</text>
<line x1="90.0" y1="100.0" x2="270.0" y2="100.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<circle cx="90.0" cy="100.0" r="4" fill="#222222"/>
<line x1="270.0" y1="100.0" x2="270.0" y2="150.0" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<text x="278.0" y="122.0" fill="#c0392b" text-anchor="start" font-size="13" font-weight="normal" font-style="normal">step: X moves s_k, A held</text>
<text x="278.0" y="138.0" fill="#c0392b" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">(a 90-degree corner at each end)</text>
<text x="62.0" y="154.0" fill="#222222" text-anchor="end" font-size="13" font-weight="normal" font-style="normal">x_k+1</text>
<line x1="270.0" y1="150.0" x2="450.0" y2="150.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<line x1="450.0" y1="150.0" x2="450.0" y2="200.0" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<text x="458.0" y="180.0" fill="#c0392b" text-anchor="start" font-size="13" font-weight="normal" font-style="normal">step</text>
<text x="62.0" y="204.0" fill="#222222" text-anchor="end" font-size="13" font-weight="normal" font-style="normal">x_k+2</text>
<line x1="450.0" y1="200.0" x2="630.0" y2="200.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<text x="638.0" y="204.0" fill="#222222" text-anchor="start" font-size="12" font-weight="normal" font-style="italic">last ring: nothing after it</text>
<line x1="90.0" y1="57.0" x2="90.0" y2="63.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="90.0" y="76.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">0</text>
<line x1="270.0" y1="57.0" x2="270.0" y2="63.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="270.0" y="76.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">360</text>
<line x1="450.0" y1="57.0" x2="450.0" y2="63.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="450.0" y="76.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">720</text>
<line x1="630.0" y1="57.0" x2="630.0" y2="63.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="630.0" y="76.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">1080</text>
<text x="70.0" y="290.0" fill="#222222" text-anchor="start" font-size="14" font-weight="bold" font-style="normal">Blended: Steps between rings = Blended, Blend over phi (drawn at 45 degrees)</text>
<line x1="70.0" y1="320.0" x2="710.0" y2="320.0" stroke="#222222" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="710.0" y="312.0" fill="#222222" text-anchor="end" font-size="12" font-weight="normal" font-style="normal">A, degrees from the Start angle (not wrapped)</text>
<line x1="70.0" y1="320.0" x2="70.0" y2="495.0" stroke="#222222" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="64.0" y="509.0" fill="#222222" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">X along the part</text>
<text x="62.0" y="364.0" fill="#222222" text-anchor="end" font-size="13" font-weight="normal" font-style="normal">x_k</text>
<line x1="90.0" y1="360.0" x2="270.0" y2="360.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<circle cx="90.0" cy="360.0" r="4" fill="#222222"/>
<line x1="270.0" y1="360.0" x2="292.5" y2="410.0" stroke="#1e8449" stroke-width="3" stroke-linecap="round"/>
<text x="300.5" y="390.0" fill="#1e8449" text-anchor="start" font-size="13" font-weight="normal" font-style="normal">blend: X moves s_k while A turns phi</text>
<text x="62.0" y="414.0" fill="#222222" text-anchor="end" font-size="13" font-weight="normal" font-style="normal">x_k+1</text>
<line x1="292.5" y1="410.0" x2="472.5" y2="410.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<line x1="472.5" y1="410.0" x2="495.0" y2="460.0" stroke="#1e8449" stroke-width="3" stroke-linecap="round"/>
<text x="503.0" y="440.0" fill="#1e8449" text-anchor="start" font-size="13" font-weight="normal" font-style="normal">blend</text>
<text x="62.0" y="464.0" fill="#222222" text-anchor="end" font-size="13" font-weight="normal" font-style="normal">x_k+2</text>
<line x1="495.0" y1="460.0" x2="675.0" y2="460.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<text x="683.0" y="464.0" fill="#222222" text-anchor="start" font-size="12" font-weight="normal" font-style="italic">last ring: nothing after it</text>
<line x1="90.0" y1="317.0" x2="90.0" y2="323.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="90.0" y="336.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">0</text>
<line x1="270.0" y1="317.0" x2="270.0" y2="323.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="270.0" y="336.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">360</text>
<line x1="472.5" y1="317.0" x2="472.5" y2="323.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="472.5" y="336.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">720+phi</text>
<line x1="675.0" y1="317.0" x2="675.0" y2="323.0" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
<text x="675.0" y="336.0" fill="#222222" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal">1080+2phi</text>
<text x="70.0" y="530.0" fill="#222222" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">Rings (blue) are whole turns, 360 degrees at one X. Ring k+1 starts at 360 + phi, ring k+2 at 720 + 2 phi.</text>
</svg>

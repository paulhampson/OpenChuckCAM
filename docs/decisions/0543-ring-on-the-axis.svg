<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif" font-size="13">
<title>A ring with its tip on the rotary axis (decision 0543)</title>
<rect width="520" height="260" fill="#fff"/>
<!-- left: normal ring -->
<text x="130" y="20" text-anchor="middle" font-weight="bold">A ring away from the axis</text>
<circle cx="130" cy="140" r="80" fill="#e8eef7" stroke="#345" stroke-width="2"/>
<circle cx="130" cy="140" r="3" fill="#000"/><text x="138" y="155">rotary axis</text>
<line x1="130" y1="30" x2="130" y2="60" stroke="#a33" stroke-width="6"/>
<circle cx="130" cy="60" r="5" fill="#a33"/>
<text x="140" y="45" fill="#a33">tool tip</text>
<path d="M 205 110 A 80 80 0 0 1 200 180" fill="none" stroke="#3a3" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="150" fill="#3a3">A turns:</text><text x="210" y="166" fill="#3a3">tip sweeps the</text><text x="210" y="182" fill="#3a3">part (a path)</text>
<!-- right: ring on the axis -->
<text x="390" y="20" text-anchor="middle" font-weight="bold">A ring on the axis (end face)</text>
<circle cx="390" cy="140" r="80" fill="#e8eef7" stroke="#345" stroke-width="2"/>
<line x1="390" y1="40" x2="390" y2="140" stroke="#a33" stroke-width="6"/>
<circle cx="390" cy="140" r="5" fill="#a33"/>
<text x="398" y="125" fill="#a33">tip on the axis</text>
<path d="M 465 110 A 80 80 0 0 1 460 180" fill="none" stroke="#3a3" stroke-width="2" marker-end="url(#a)"/>
<text x="350" y="245" fill="#333">A turns, the tip stays put: no path to ramp along</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3"/></marker></defs>
</svg>

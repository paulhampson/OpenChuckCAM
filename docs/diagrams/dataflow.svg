<path class="dep" d="M1112.0,390 L1112.0,470" marker-end="url(#arr)"/>
<path class="dep" d="M1112,526 L1112,560" marker-end="url(#arr)"/>
<text class="note" x="30" y="650">Background jobs (UI-09, NFR-04): import, generate and simulate run on the worker pool, with progress and cancellation. Results are identical for any thread count (NFR-06).</text>
<rect class="box edit" x="30" y="672" width="22" height="14" rx="3"/>
<text class="note" x="58" y="684">user edit, stored in the project</text>
<rect class="box svc" x="293.2" y="672" width="22" height="14" rx="3"/>
<text class="note" x="321.2" y="684">engine: import, simulate</text>
<rect class="box lib" x="503.59999999999997" y="672" width="22" height="14" rx="3"/>
<text class="note" x="531.5999999999999" y="684">engine: generate, post</text>
<path class="flow" d="M700.8,679 L740.8,679" marker-end="url(#arr)"/>
<text class="note" x="748.8" y="684">data flow</text>
<path class="feedback" d="M818.8,679 L858.8,679" marker-end="url(#arr)"/>
<text class="note" x="866.8" y="684">feedback between operations</text>
</svg>

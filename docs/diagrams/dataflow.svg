<text class="stage" x="432.0" y="326" text-anchor="middle">3 Select</text>
<text class="small" x="432.0" y="346" text-anchor="middle">selection set</text>
<text class="small2" x="432.0" y="364" text-anchor="middle">faces, triangles</text>
<rect class="box edit" x="540" y="290" width="124" height="100" rx="6"/>

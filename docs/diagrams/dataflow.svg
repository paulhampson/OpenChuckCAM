<rect class="box store" x="960" y="560" width="220" height="56" rx="6"/>
<text class="name" x="1070.0" y="586.0" text-anchor="middle">openchuck-gcode replay</text>
<text class="sub" x="1070.0" y="603.0" text-anchor="middle">checks A, feed, limits vs IR (GC-08)</text>
<path class="dep" d="M262.0,390 L262.0,470" marker-end="url(#arr)"/>
<path class="dep" d="M432.0,390 L432.0,470" marker-end="url(#arr)"/>
<path class="dep" d="M602.0,390 L602.0,470" marker-end="url(#arr)"/>
<path class="dep" d="M772.0,390 L772.0,470" marker-end="url(#arr)"/>

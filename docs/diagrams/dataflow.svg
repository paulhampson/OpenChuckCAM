<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 705" width="1200" height="705" role="img" aria-labelledby="t d"><title id="t">OpenChuckCAM dataflow</title><desc id="d">The operation pipeline from import to G-code (architecture section 6). Setup, selection and operation are user edits stored in the project. Generate, simulate and post are engine stages. Simulated stock feeds the next operation back to Generate.</desc><style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .band { fill: #f6f8fa; }
  .bandlabel { fill: #57606a; font-size: 13px; font-weight: 600; }
  .name { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .sub { fill: #4b5563; font-size: 11.5px; }
  .title { fill: #1f2328; font-size: 13px; font-weight: 600; }
  .stage { fill: #1f2328; font-size: 12px; font-weight: 600; }
  .small { fill: #1f2328; font-size: 10.5px; }
  .small2 { fill: #4b5563; font-size: 10.5px; }
  .lbl { fill: #4b5563; font-size: 11px; }
  .note { fill: #4b5563; font-size: 11px; }
  .pill { fill: #ffffff; }
  .dep, .flow { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .dev, .feedback { stroke: #57606a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
  .arrowhead { fill: #57606a; }
  .front { fill: #ddf4ff; stroke: #0969da; }
  .app { fill: #fbefff; stroke: #8250df; }
  .svc { fill: #dafbe1; stroke: #1a7f37; }
  .lib { fill: #fff8c5; stroke: #9a6700; }
  .data { fill: #eaeef2; stroke: #57606a; }
  .edit { fill: #ddf4ff; stroke: #0969da; }
  .test { fill: #ffffff; stroke: #6e7781; stroke-dasharray: 6 4; }
  .planned { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 6 4; }
  .store { fill: #f6f8fa; stroke: #57606a; }
  .box { stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .band { fill: #161b22; }
    .bandlabel { fill: #9198a1; }
    .name, .title, .stage, .small { fill: #e6edf3; }
    .sub, .small2, .lbl, .note { fill: #b1bac4; }
    .pill { fill: #0d1117; }
    .dep, .flow { stroke: #9198a1; }
    .dev, .feedback { stroke: #9198a1; }
    .arrowhead { fill: #9198a1; }
    .front, .edit { fill: #0c2d48; stroke: #58a6ff; }
    .app { fill: #2e1f4a; stroke: #bc8cff; }
    .svc { fill: #0f3a22; stroke: #3fb950; }
    .lib { fill: #3d2e0a; stroke: #d29922; }
    .data { fill: #21262d; stroke: #8b949e; }
    .test { fill: #0d1117; stroke: #8b949e; }
    .planned { fill: #0d1117; stroke: #6e7681; }
    .store { fill: #161b22; stroke: #8b949e; }
  }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="box front" x="190" y="40" width="280" height="60" rx="6"/>
<text class="name" x="330.0" y="68.0" text-anchor="middle">openchuck-ui</text>
<text class="sub" x="330.0" y="85.0" text-anchor="middle">edits, views, parameter forms</text>
<rect class="box front" x="530" y="40" width="250" height="60" rx="6"/>
<text class="name" x="655.0" y="68.0" text-anchor="middle">openchuck-viewport</text>
<text class="sub" x="655.0" y="85.0" text-anchor="middle">draws meshes and toolpaths</text>
<rect class="box front" x="840" y="40" width="280" height="60" rx="6"/>
<text class="name" x="980.0" y="68.0" text-anchor="middle">openchuck-cli</text>
<text class="sub" x="980.0" y="85.0" text-anchor="middle">headless front end</text>
<rect class="box app" x="60" y="160" width="1080" height="50" rx="6"/>
<text class="name" x="600.0" y="183.0" text-anchor="middle">openchuck-app</text>
<text class="sub" x="600.0" y="200.0" text-anchor="middle">commands, undo, job manager on a worker pool, caches, events</text>
<path class="dep" d="M330,100 L330,160" marker-end="url(#arr)"/>
<path class="dep" d="M980,100 L980,160" marker-end="url(#arr)"/>
<path class="dep" d="M620,160 L620,100" marker-end="url(#arr)"/>
<rect class="pill" x="334.0" y="121" width="117.4" height="17" rx="3"/><text class="lbl" x="340" y="134" text-anchor="start">commands, queries</text>
<rect class="pill" x="914.4" y="121" width="61.6" height="17" rx="3"/><text class="lbl" x="970" y="134" text-anchor="end">commands</text>
<rect class="pill" x="622.0" y="121" width="117.4" height="17" rx="3"/><text class="lbl" x="628" y="134" text-anchor="start">meshes, toolpaths</text>
<rect class="box svc" x="30" y="290" width="124" height="100" rx="6"/>
<text class="stage" x="92.0" y="326" text-anchor="middle">1 Import</text>
<text class="small" x="92.0" y="346" text-anchor="middle">openchuck-import</text>
<text class="small2" x="92.0" y="364" text-anchor="middle">STL or STEP, hash</text>
<rect class="box edit" x="200" y="290" width="124" height="100" rx="6"/>
<text class="stage" x="262.0" y="326" text-anchor="middle">2 Setup</text>
<text class="small" x="262.0" y="346" text-anchor="middle">machine, stock</text>

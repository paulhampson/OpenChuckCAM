<text class="small" x="772.0" y="346" text-anchor="middle">openchuck-path</text>
<text class="small2" x="772.0" y="364" text-anchor="middle">toolpath IR</text>
<rect class="box svc" x="880" y="290" width="124" height="100" rx="6"/>
<text class="stage" x="942.0" y="326" text-anchor="middle">6 Simulate</text>
<text class="small" x="942.0" y="346" text-anchor="middle">openchuck-sim</text>
<text class="small2" x="942.0" y="364" text-anchor="middle">deviation, time</text>
<rect class="box lib" x="1050" y="290" width="124" height="100" rx="6"/>
<text class="stage" x="1112.0" y="326" text-anchor="middle">7 Post</text>
<text class="small" x="1112.0" y="346" text-anchor="middle">openchuck-post</text>
<text class="small2" x="1112.0" y="364" text-anchor="middle">G-code</text>
<path class="flow" d="M156,340 L198,340" marker-end="url(#arr)"/>
<path class="flow" d="M326,340 L368,340" marker-end="url(#arr)"/>
<path class="flow" d="M496,340 L538,340" marker-end="url(#arr)"/>
<path class="flow" d="M666,340 L708,340" marker-end="url(#arr)"/>
<path class="flow" d="M836,340 L878,340" marker-end="url(#arr)"/>
<path class="flow" d="M1006,340 L1048,340" marker-end="url(#arr)"/>
<text class="lbl" x="177" y="282" text-anchor="middle">model data</text>
<text class="lbl" x="347" y="282" text-anchor="middle">setup</text>
<text class="lbl" x="517" y="282" text-anchor="middle">selection</text>
<text class="lbl" x="687" y="282" text-anchor="middle">operation</text>
<text class="lbl" x="857" y="282" text-anchor="middle">toolpath IR</text>
<text class="lbl" x="1027" y="282" text-anchor="middle">toolpath IR</text>
<path class="feedback" d="M942.0,290 C942.0,230 772.0,230 772.0,290" marker-end="url(#arr)"/>
<rect class="pill" x="751.8" y="225" width="210.4" height="17" rx="3"/><text class="lbl" x="857.0" y="238" text-anchor="middle">stock for operation N+1 (SIM-06)</text>
<rect class="box store" x="190" y="470" width="450" height="56" rx="6"/>
<text class="name" x="415.0" y="496.0" text-anchor="middle">Project folder</text>
<text class="sub" x="415.0" y="513.0" text-anchor="middle">TOML text, Git-tracked, no generated data (PRJ-01, PRJ-03)</text>
<rect class="box store" x="700" y="470" width="300" height="56" rx="6"/>
<text class="name" x="850.0" y="496.0" text-anchor="middle">Cache</text>
<text class="sub" x="850.0" y="513.0" text-anchor="middle">generated, git-ignored, keyed by input hash</text>
<rect class="box store" x="1030" y="470" width="150" height="56" rx="6"/>
<text class="name" x="1105.0" y="496.0" text-anchor="middle">G-code file</text>

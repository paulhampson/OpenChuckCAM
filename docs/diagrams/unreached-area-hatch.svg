<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="14">
<title id="t">Unreachable-area hatch painted on the surface, and the footprint closing (decision 0549)</title>
<desc id="d">Left: the same part seen twice, before and after it turns. The old dot grid stays on the same screen positions; the new hatching stays on the surface, so it narrows with the part. Right: a strip of triangles with sample points; the triangles the points lie on leave holes, closing fills each hole held by two marked neighbours within 1.5 millimetres of a sample, and stops at a crease between surfaces.</desc>
<rect width="960" height="600" fill="#ffffff"/>
<defs><clipPath id="a1"><rect x="40" y="90" width="170" height="110" rx="14"/></clipPath><clipPath id="a2"><rect x="250" y="90" width="110" height="110" rx="14"/></clipPath>
<clipPath id="b1"><rect x="40" y="290" width="170" height="110" rx="14"/></clipPath><clipPath id="b2"><rect x="250" y="290" width="110" height="110" rx="14"/></clipPath></defs>

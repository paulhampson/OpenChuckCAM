<text x="460" y="480" fill="#a11" font-size="12">Red dashed line: a crease of more than 25° (a lip, a wall).</text>
<text x="460" y="498" fill="#a11" font-size="12">Closing stops there: the surface beyond it stays unmarked.</text>
<text x="40" y="560" fill="#15171a" font-size="13">Rules: same surface (normals within 25°), at most 6 passes, within 1.5 mm of a sample point, nothing is ever unmarked.</text>

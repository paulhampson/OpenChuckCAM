<text class="name" x="695.0" y="303.0" text-anchor="middle">openchuck-geom</text>
<text class="sub" x="695.0" y="320.0" text-anchor="middle">mesh checks, BVH</text>
<rect class="box svc" x="790" y="270" width="160" height="70" rx="6"/>
<text class="name" x="870.0" y="303.0" text-anchor="middle">openchuck-project</text>
<text class="sub" x="870.0" y="320.0" text-anchor="middle">TOML, selection sets</text>
<rect class="box planned" x="980" y="270" width="140" height="70" rx="6"/>
<text class="name" x="1050.0" y="303.0" text-anchor="middle">openchuck-vcs</text>
<text class="sub" x="1050.0" y="320.0" text-anchor="middle">git2 only, planned</text>
<rect class="box lib" x="190" y="400" width="170" height="60" rx="6"/>
<text class="name" x="275.0" y="428.0" text-anchor="middle">openchuck-path</text>
<text class="sub" x="275.0" y="445.0" text-anchor="middle">4-axis strategies</text>
<rect class="box lib" x="400" y="400" width="170" height="60" rx="6"/>
<text class="name" x="485.0" y="428.0" text-anchor="middle">openchuck-post</text>
<text class="sub" x="485.0" y="445.0" text-anchor="middle">definitions as data</text>
<rect class="box lib" x="610" y="400" width="170" height="60" rx="6"/>
<text class="name" x="695.0" y="428.0" text-anchor="middle">openchuck-gcode</text>
<text class="sub" x="695.0" y="445.0" text-anchor="middle">reads and replays G-code</text>
<rect class="box data" x="190" y="520" width="930" height="60" rx="6"/>
<text class="name" x="655.0" y="548.0" text-anchor="middle">openchuck-types</text>
<text class="sub" x="655.0" y="565.0" text-anchor="middle">plain data, neutral toolpath IR, job context</text>
<rect class="box test" x="190" y="630" width="300" height="60" rx="6"/>
<text class="name" x="340.0" y="658.0" text-anchor="middle">openchuck-testkit</text>
<text class="sub" x="340.0" y="675.0" text-anchor="middle">dev-dependency only: oracle, golden files</text>
<rect class="box test" x="520" y="630" width="300" height="60" rx="6"/>
<text class="name" x="670.0" y="658.0" text-anchor="middle">openchuck-benches</text>
<text class="sub" x="670.0" y="675.0" text-anchor="middle">benchmarks, dev-dependency only</text>
<path class="dep" d="M330,110 L330,165" marker-end="url(#arr)"/>
<path class="dep" d="M980,110 L980,165" marker-end="url(#arr)"/>
<path class="dep" d="M470,75 L530,75" marker-end="url(#arr)"/>
<path class="dep" d="M265,215 L265,270" marker-end="url(#arr)"/>
<path class="dep" d="M480,215 L480,270" marker-end="url(#arr)"/>
<path class="dep" d="M695,215 L695,270" marker-end="url(#arr)"/>
<path class="dep" d="M870,215 L870,270" marker-end="url(#arr)"/>
<path class="dep" d="M1050,215 L1050,270" marker-end="url(#arr)"/>
<path class="dep" d="M590,305 L620,305" marker-end="url(#arr)"/>
<path class="dep" d="M265,340 L265,400" marker-end="url(#arr)"/>
<path class="dev" d="M340,630 L340,580" marker-end="url(#arr)"/>
<rect class="pill" x="332.0" y="127" width="117.4" height="17" rx="3"/><text class="lbl" x="338" y="140" text-anchor="start">commands, queries</text>
<rect class="pill" x="916.4" y="127" width="61.6" height="17" rx="3"/><text class="lbl" x="972" y="140" text-anchor="end">commands</text>
<text class="title" x="26" y="745">Key</text>
<rect class="box front" x="90" y="733" width="22" height="14" rx="3"/>
<text class="note" x="118" y="745">front end</text>
<rect class="box app" x="203.4" y="733" width="22" height="14" rx="3"/>
<text class="note" x="231.4" y="745">application</text>
<rect class="box svc" x="330.0" y="733" width="22" height="14" rx="3"/>
<text class="note" x="358.0" y="745">service</text>
<rect class="box lib" x="430.2" y="733" width="22" height="14" rx="3"/>
<text class="note" x="458.2" y="745">library</text>
<rect class="box data" x="530.4" y="733" width="22" height="14" rx="3"/>
<text class="note" x="558.4" y="745">shared data</text>
<rect class="box test" x="657.0" y="733" width="22" height="14" rx="3"/>
<text class="note" x="685.0" y="745">test-only</text>
<rect class="box planned" x="770.4" y="733" width="22" height="14" rx="3"/>
<text class="note" x="798.4" y="745">planned</text>
<path class="dep" d="M90,770 L130,770" marker-end="url(#arr)"/>
<text class="note" x="138" y="774">depends on</text>
<path class="dev" d="M240,770 L280,770" marker-end="url(#arr)"/>
<text class="note" x="288" y="774">dev-dependency</text>
<text class="note" x="26" y="800">Omitted for clarity: arrows to openchuck-types (every crate that holds plain data depends on it), and from openchuck-app to path, post and gcode.</text>
</svg>

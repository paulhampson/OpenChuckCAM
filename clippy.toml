# SPDX-License-Identifier: AGPL-3.0-or-later
# Tests may unwrap and index; library code may not (NFR-07, architecture section 8).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Determinism (NFR-06, architecture section 8): containers whose iteration order
# can reach output must be ordered. A use that never affects output may be
# allowed locally with `#[allow(clippy::disallowed_types)]` and a comment saying why.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap (NFR-06)" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet (NFR-06)" },
]

# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Nightly development builds (decision record 0023). Each night, if `main` has
# moved since the last successful nightly build, build `openchuck-cli` and
# `openchuck-ui` in release mode for Linux, Windows and macOS and upload one
# archive per platform as a workflow artifact. A build of `main` also replaces
# the rolling `nightly` pre-release with those archives. These are development
# builds, not releases: the release route (tags, packaging, installers) is
# decided in work breakdown slice 20 (architecture section 12).
#
# A manual run always builds, from whichever branch it is started on.
name: Nightly build

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Changed since the last nightly build
    runs-on: ubuntu-latest
    # Reads this workflow's earlier runs.
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      date: ${{ steps.check.outputs.date }}
      short: ${{ steps.check.outputs.short }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "short=${SHA:0:9}"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: building $SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The newest successful run on this branch. This run is still in
          # progress, so it is not listed. A failed build is retried the next
          # night even when nothing has changed.
          last=$(gh api "repos/$REPO/actions/workflows/nightly-build.yml/runs?branch=$BRANCH&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No change since the last nightly build of $SHA; nothing built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $SHA (last nightly build: ${last:-none})." >> "$GITHUB_STEP_SUMMARY"
          fi

  notices:
    name: Licence notices (cargo about)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Shipped with every archive (NFR-10).
      - run: cargo about generate --locked about.hbs > THIRD-PARTY-NOTICES.html
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-notices
          path: THIRD-PARTY-NOTICES.html
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    needs: [changes, notices]
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NAME: openchuckcam-nightly-${{ needs.changes.outputs.date }}-${{ needs.changes.outputs.short }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build the binaries (release)
        run: cargo build --release --locked --target ${{ matrix.target }} -p openchuck-cli -p openchuck-ui
      - uses: actions/download-artifact@v8
        with:
          name: nightly-notices
      # The posts and the built-in machine profile are compiled into the
      # binaries, so the archive needs no data folders beside them.
      - name: Assemble the archive folder
        env:
          EXE: ${{ matrix.exe }}
          TARGET: ${{ matrix.target }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          dir="dist/$NAME"
          mkdir -p "$dir"
          cp "target/$TARGET/release/openchuck-cli$EXE" "target/$TARGET/release/openchuck-ui$EXE" "$dir/"
          cp LICENSES/AGPL-3.0-or-later.txt "$dir/LICENSE.txt"
          cp THIRD-PARTY-NOTICES.html "$dir/"
          # The NFR-12 notice, read from its one definition in the code.
          notice=$(perl -0777 -ne 'if (/VERIFY_GCODE_NOTICE: &str = "(.*?)";/s) { $s = $1; $s =~ s/\\\n\s*//g; print $s }' crates/openchuck-types/src/notice.rs)
          [ -n "$notice" ] || { echo "could not read the G-code notice"; exit 1; }
          {
            echo "OpenChuckCAM nightly development build"
            echo
            echo "Commit:   $SHA ($REF)"
            echo "Built:    $(date -u +%Y-%m-%dT%H:%MZ) on ${ImageOS:-unknown} ${ImageVersion:-}"
            echo "Target:   $TARGET"
            echo "Compiler: $(rustc --version)"
            echo
            echo "This is an automatic build of the development branch, not a release."
            echo "It passed no release gate and may be incomplete or broken."
            echo
            echo "$notice"
            echo
            echo "Contents:"
            printf '  %-26s %s\n' \
              "openchuck-cli$EXE" "the command-line front end (run it with --help)" \
              "openchuck-ui$EXE" "the desktop application" \
              "LICENSE.txt" "GNU Affero General Public License v3.0 or later" \
              "THIRD-PARTY-NOTICES.html" "licences of the bundled third-party crates"
            echo
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$SHA"
            case "$TARGET" in
              *apple*)
                echo
                echo "macOS: the binaries are not signed or notarised. If macOS blocks them,"
                echo "run: xattr -d com.apple.quarantine openchuck-cli openchuck-ui" ;;
              *windows*)
                echo
                echo "Windows: the binaries are not signed, so SmartScreen may warn on first run." ;;
              *linux*)
                echo
                echo "Linux: built against the glibc of the runner image above. The desktop"
                echo "application needs a Vulkan or OpenGL driver and X11 or Wayland." ;;
            esac
          } > "$dir/README.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            sed -i 's/$/\r/' "$dir/README.txt"
          fi
      - name: Pack (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      - name: Pack (zip)
        if: matrix.archive == 'zip'
        run: cd dist && 7z a -tzip -bso0 "$NAME.zip" "$NAME"
      # Uploaded as the archive itself (not zipped again), so the Unix
      # executable bits survive the download.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.NAME }}.${{ matrix.archive }}
          archive: false
          retention-days: 30
          if-no-files-found: error

  # The rolling `nightly` pre-release: deleted and created again on each
  # build, so it always holds one complete set of archives from one commit.
  # Only `main` publishes it, and only when every platform built.
  publish:
    name: Publish the nightly pre-release
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The archives were uploaded unzipped; skip-decompress keeps the Windows
      # .zip as it is.
      - uses: actions/download-artifact@v8
        with:
          pattern: openchuckcam-nightly-*
          merge-multiple: true
          skip-decompress: true
          path: dist
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DATE: ${{ needs.changes.outputs.date }}
          SHORT: ${{ needs.changes.outputs.short }}
        run: |
          ls -l dist
          count=$(find dist -maxdepth 1 -type f -name 'openchuckcam-nightly-*' | wc -l)
          [ "$count" -eq 3 ] || { echo "expected 3 archives, found $count"; exit 1; }
          notice=$(perl -0777 -ne 'if (/VERIFY_GCODE_NOTICE: &str = "(.*?)";/s) { $s = $1; $s =~ s/\\\n\s*//g; print $s }' crates/openchuck-types/src/notice.rs)
          [ -n "$notice" ] || { echo "could not read the G-code notice"; exit 1; }
          {
            echo "Automatic development build of \`main\` at $SHA, built $DATE."
            echo
            echo "**This is not a release.** It passed no release gate and may be incomplete or broken. It is replaced by the next nightly build."
            echo
            echo "**$notice**"
            echo
            echo "Each archive holds \`openchuck-cli\`, \`openchuck-ui\`, the licence, the third-party notices and a README. The binaries are not signed: macOS quarantines them and Windows SmartScreen may warn (see the README in each archive)."
          } > notes.md
          if gh release view nightly -R "$REPO" > /dev/null 2>&1; then
            gh release delete nightly -R "$REPO" --cleanup-tag --yes
          fi
          gh release create nightly dist/openchuckcam-nightly-* -R "$REPO" \
            --target "$SHA" --prerelease --latest=false \
            --title "Nightly build $DATE ($SHORT)" --notes-file notes.md
          echo "Published the nightly pre-release for $SHA." >> "$GITHUB_STEP_SUMMARY"

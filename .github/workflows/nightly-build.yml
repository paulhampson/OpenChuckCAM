# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Nightly development builds (decision record 0023). Each night, if `main` has
# moved since the last successful nightly build, build `openchuck-cli` and
# `openchuck-ui` in release mode for Linux, Windows and macOS and upload one
# archive per platform as a workflow artifact (build-archives.yml, shared with
# the release workflow). A build of `main` also replaces the rolling `nightly`
# pre-release with those archives. These are development builds, not releases:
# releases are built by release.yml from `lib-v` and `app-v` tags after the
# release gate (decision records 0031 and 0091).
#
# A manual run always builds, from whichever branch it is started on.
name: Nightly build

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Changed since the last nightly build
    runs-on: ubuntu-latest
    # Reads this workflow's earlier runs.
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      date: ${{ steps.check.outputs.date }}
      short: ${{ steps.check.outputs.short }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "short=${SHA:0:9}"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: building $SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The newest successful run on this branch. This run is still in
          # progress, so it is not listed. A failed build is retried the next
          # night even when nothing has changed.
          last=$(gh api "repos/$REPO/actions/workflows/nightly-build.yml/runs?branch=$BRANCH&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No change since the last nightly build of $SHA; nothing built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $SHA (last nightly build: ${last:-none})." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The notices, build, assemble and pack steps are shared with the release workflow
  # (build-archives.yml, decision 0091).
  build:
    name: Archives
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/build-archives.yml
    with:
      name: openchuckcam-nightly-${{ needs.changes.outputs.date }}-${{ needs.changes.outputs.short }}
      kind: nightly

  # The rolling `nightly` pre-release: replaced on each build, so it always
  # holds one complete set of archives from one commit.
  # Only `main` publishes it, and only when every platform built.
  publish:
    name: Publish the nightly pre-release
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The archives were uploaded unzipped; skip-decompress keeps the Windows
      # .zip as it is.
      - uses: actions/download-artifact@v8
        with:
          pattern: openchuckcam-nightly-*
          merge-multiple: true
          skip-decompress: true
          path: dist
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DATE: ${{ needs.changes.outputs.date }}
          SHORT: ${{ needs.changes.outputs.short }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ls -l dist
          count=$(find dist -maxdepth 1 -type f -name 'openchuckcam-nightly-*' | wc -l)
          [ "$count" -eq 3 ] || { echo "expected 3 archives, found $count"; exit 1; }
          notice=$(perl -0777 -ne 'if (/VERIFY_GCODE_NOTICE: &str = "(.*?)";/s) { $s = $1; $s =~ s/\\\n\s*//g; print $s }' crates/openchuck-types/src/notice.rs)
          [ -n "$notice" ] || { echo "could not read the G-code notice"; exit 1; }
          {
            echo "Automatic development build of \`main\` at $SHA, built $DATE."
            echo
            echo "**This is not a release.** It passed no release gate and may be incomplete or broken. It is replaced by the next nightly build."
            echo
            echo "**$notice**"
            echo
            echo "Each archive holds \`openchuck-cli\`, \`openchuck-ui\`, the licence, the third-party notices and a README. The binaries are not signed: macOS quarantines them and Windows SmartScreen may warn (see the README in each archive)."
          } > notes.md
          # Upload everything to a draft first: a draft creates no tag and is
          # not visible to visitors, so the current `nightly` release stays up
          # until its replacement holds all three archives. A draft left by
          # an earlier failed run is removed first.
          staging="nightly-staging-$RUN_ID"
          gh release list -R "$REPO" --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("nightly-staging-"))) | .tagName' |
            while read -r old; do gh release delete "$old" -R "$REPO" --yes; done
          gh release create "$staging" dist/openchuckcam-nightly-* -R "$REPO" \
            --draft --target "$SHA" --prerelease \
            --title "Nightly build $DATE ($SHORT)" --notes-file notes.md
          assets=$(gh release view "$staging" -R "$REPO" --json assets --jq '.assets | length')
          [ "$assets" -eq 3 ] || { echo "the draft holds $assets archives, expected 3"; exit 1; }
          # Swap: remove the old release, then the tag on its own (it can
          # outlive its release, and publishing onto an existing tag would keep
          # the old commit), then publish the draft as `nightly`, which creates
          # the tag at the built commit.
          if gh release view nightly -R "$REPO" > /dev/null 2>&1; then
            gh release delete nightly -R "$REPO" --yes
          fi
          if gh api "repos/$REPO/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/nightly"
          fi
          gh release edit "$staging" -R "$REPO" --tag nightly --draft=false --prerelease --latest=false
          echo "Published the nightly pre-release for $SHA." >> "$GITHUB_STEP_SUMMARY"

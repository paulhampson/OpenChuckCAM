# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Releases (work breakdown slice 20 items 8 and 9; decision records 0031 and 0091).
#
# Runs only for a release tag, `lib-v<version>` (the library family) or `app-v<version>` (the
# application binaries), and by hand. The first job runs the release gate (`cargo xtask
# release-gate`: dependency rules, cargo deny, the golden G-code comparison and the LinuxCNC
# replay); every build and publish job needs it, so a failing gate publishes nothing. The Z1 air cut
# (gates 4 and 5) is a manual release-checklist step, not part of the gate (decision record 0106).
#
# - `app-v<version>`: the archives for the three platforms (build-archives.yml, shared with the
#   nightly build) are attached to a GitHub release, not a pre-release, for the existing tag.
# - `app-v<version>` also builds and checks the release's user guide (job `docs`) and, after the
#   release, adds it to the publish-only branch docs-releases (job `publish-docs`; decision 0400).
# - `lib-v<version>`: the four library crates pass `cargo publish --dry-run`. A tag push never
#   publishes them to crates.io. Only a manual run on a `lib-v` tag with `dry_run` unticked AND
#   `publish_crates` ticked publishes them, with the repository secret CARGO_REGISTRY_TOKEN, which
#   the owner creates (decision 0138, OI-303; docs/releasing.md says what the owner does).
#
# A manual run is a dry run unless `dry_run` is unticked: it runs the gate, builds and checks the
# archives and the library publish dry run, and publishes nothing. A manual run that publishes
# must be started on a release tag; started on a branch, it fails before the gate.
name: Release

on:
  push:
    tags:
      - "lib-v*"
      - "app-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing.
        type: boolean
        default: true
      publish_crates:
        description: >-
          Publish the library family to crates.io (a lib-v tag, dry_run unticked and the
          CARGO_REGISTRY_TOKEN secret are needed). Publishing cannot be undone.
        type: boolean
        default: false

permissions:
  contents: read

# One release run per tag or branch at a time; a second waits rather than replacing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CMake 4 on the runners rejects OpenCASCADE 7.8.1's cmake_minimum_required (decision 0003).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  plan:
    name: What this run releases
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      lib: ${{ steps.plan.outputs.lib }}
      publish: ${{ steps.plan.outputs.publish }}
      crates: ${{ steps.plan.outputs.crates }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # On a tag push there is no input: the run publishes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Only a manual run can publish crates; a tag push has no input, so it never does.
          PUBLISH_CRATES: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates }}
          SHA: ${{ github.sha }}
        run: |
          # The workspace version, which every crate shares (lockstep, decision 0031 item 2).
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "could not read the workspace version"; exit 1; }
          tag=""
          app=true
          lib=true
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            case "$tag" in
              app-v*) lib=false ;;
              lib-v*) app=false ;;
              *) echo "::error::'$tag' is not a release tag (lib-v<version> or app-v<version>)"; exit 1 ;;
            esac
          fi
          if [ "$DRY_RUN" = "true" ]; then
            publish=false
          elif [ -z "$tag" ]; then
            echo "::error::A run that publishes must be started on a lib-v or app-v tag, not on $REF. Tick dry_run to build and verify only."
            exit 1
          else
            publish=true
          fi
          crates=false
          if [ "$PUBLISH_CRATES" = "true" ]; then
            if [ "$publish" != "true" ] || [ "$lib" != "true" ]; then
              echo "::error::publish_crates needs a run on a lib-v tag with dry_run unticked; nothing was published."
              exit 1
            fi
            crates=true
          fi
          if [ "$publish" = "true" ]; then
            kind=release
            name="openchuckcam-$version"
          else
            kind=dry-run
            name="openchuckcam-dry-run-${SHA:0:9}"
          fi
          {
            echo "app=$app"
            echo "lib=$lib"
            echo "publish=$publish"
            echo "crates=$crates"
            echo "tag=$tag"
            echo "version=$version"
            echo "name=$name"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Version $version at $SHA (${tag:-no tag}, $EVENT)."
            echo
            echo "- Application archives: $app"
            echo "- Library publish dry run: $lib"
            echo "- Publishes: $publish"
            echo "- Publishes the library family to crates.io: $crates"
          } >> "$GITHUB_STEP_SUMMARY"
      # The release tags should be protected by a tag ruleset, so only the maintainer can create
      # the tags that start a publishing run (OI-305; docs/releasing.md, "Protect the release
      # tags"). The repository setting is the owner's; this step only reports. It warns, and never
      # fails, on every run (the coordinator's instruction of 7 Nov 2026, decision 0541): whether
      # GITHUB_TOKEN can read the rulesets is not known until a run shows it, and a check that
      # could not read them must not block the first release. It may become a failure later.
      - name: Are the release tags protected? (warning only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          warn() {
            echo "::warning title=Release tags (OI-305)::$1"
            echo "- Warning: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$ACTOR" != "$OWNER" ]; then
            warn "This run was started by $ACTOR, not by the repository owner $OWNER."
          fi
          if ! ids=$(gh api "repos/$REPO/rulesets?targets=tag&includes_parents=true" --jq '.[] | select(.enforcement == "active") | .id' 2>&1); then
            warn "Could not read the repository's rulesets ($ids); check by hand that an active tag ruleset protects lib-v* and app-v*."
            exit 0
          fi
          patterns=""
          for id in $ids; do
            patterns="$patterns $(gh api "repos/$REPO/rulesets/$id" --jq '.conditions.ref_name.include[]?' 2>/dev/null | tr '\n' ' ' || true)"
          done
          for tag in lib-v app-v; do
            case " $patterns " in
              *" refs/tags/$tag* "*|*" $tag* "*|*" ~ALL "*) echo "- An active tag ruleset covers $tag*." >> "$GITHUB_STEP_SUMMARY" ;;
              *) warn "No active tag ruleset covers $tag* (found:${patterns:- none}). See docs/releasing.md." ;;
            esac
          done

  # The release gate (slice 20 item 9). The tag check, the dependency rules, cargo deny, every
  # golden-file test (with the STEP kernel, for the `drilling` reference job) and the LinuxCNC
  # replay of every golden program, in one job: the replay alone takes about 22 minutes.
  gate:
    name: Release gate
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      # Built from docker/linuxcnc by the linuxcnc-image workflow (as in CI's gate 3).
      LINUXCNC_IMAGE: ghcr.io/paulhampson/openchuckcam-linuxcnc:2.9.10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/occt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-gate
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Get the LinuxCNC image
        run: docker pull "$LINUXCNC_IMAGE" || docker build -t "$LINUXCNC_IMAGE" docker/linuxcnc
      - name: Run the release gate
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: cargo xtask release-gate --docker "$LINUXCNC_IMAGE" --keep-reports target/replay ${TAG:+--tag "$TAG"}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-gate-replay-reports
          path: target/replay
          if-no-files-found: ignore

  archives:
    name: Archives
    needs: [plan, gate]
    if: needs.plan.outputs.app == 'true'
    uses: ./.github/workflows/build-archives.yml
    with:
      name: ${{ needs.plan.outputs.name }}
      kind: ${{ needs.plan.outputs.kind }}
      version: ${{ needs.plan.outputs.version }}

  # Every archive is there and readable, and carries the STEP reader and the OpenCASCADE licence
  # notice and source offer (LGPL-2.1, statically linked; decision 0003, OI-29), on a dry run and
  # before a release alike.
  check-archives:
    name: Check the archives
    needs: [plan, gate, archives]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      # Only for Cargo.lock: the notice must name the OpenCASCADE version the build compiled.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Cargo.lock
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.plan.outputs.name }}-*
          merge-multiple: true
          skip-decompress: true
          path: dist
      - name: Check the archives
        env:
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -l dist
          occt=$(awk '/^name = "occt-sys"$/ { getline; gsub(/[^0-9.]/, "", $0); print; exit }' Cargo.lock)
          [ -n "$occt" ] || { echo "no occt-sys version in Cargo.lock"; exit 1; }
          # check <target> <ext> <exe suffix>: list the archive, then read the notice out of it.
          # macOS carries the application as OpenChuckCAM.app with its own STEP reader, and the
          # STEP reader again beside openchuck-cli (decision 0541, OI-300).
          app=OpenChuckCAM.app/Contents
          check() {
            target=$1; ext=$2; exe=$3; dir="$NAME-$target"
            if [ "$ext" = zip ]; then
              unzip -Z1 "dist/$dir.zip" > list.txt
            else
              tar -tzf "dist/$dir.tar.gz" > list.txt
            fi
            case "$target" in
              *apple*) programs="$app/Info.plist $app/_CodeSignature/CodeResources $app/MacOS/openchuck-ui $app/MacOS/openchuck-step-worker openchuck-cli openchuck-step-worker" ;;
              *) programs="openchuck-ui$exe openchuck-step-worker$exe openchuck-cli$exe" ;;
            esac
            for f in README.txt $programs OPENCASCADE-NOTICE.txt LICENSE_LGPL_21.txt OCCT_LGPL_EXCEPTION.txt TOOL-DATA-CREDITS.txt; do
              grep -qxF "$dir/$f" list.txt || { echo "no $f in the $target archive"; exit 1; }
            done
            case "$target" in
              *apple*)
                tar -xzOf "dist/$dir.tar.gz" "$dir/$app/Info.plist" > plist.txt
                grep -qF "<string>$VERSION</string>" plist.txt || { echo "the bundle's Info.plist does not name the version $VERSION"; exit 1; } ;;
              *linux*)
                tar -xzOf "dist/$dir.tar.gz" "$dir/README.txt" > readme.txt
                grep -q "^Linux: needs glibc " readme.txt || { echo "the Linux README states no glibc floor"; exit 1; } ;;
            esac
            if [ "$ext" = zip ]; then
              unzip -p "dist/$dir.zip" "$dir/OPENCASCADE-NOTICE.txt" > notice.txt
            else
              tar -xzOf "dist/$dir.tar.gz" "$dir/OPENCASCADE-NOTICE.txt" > notice.txt
            fi
            # Whole version tokens: 7.8.10 or 7.8.1.2 must not pass for 7.8.1, and both places that name
            # the version (the introduction and the source offer) must agree with Cargo.lock.
            v=$(printf '%s' "$occt" | sed 's/\./\\./g')
            vend='($|[^0-9.]|\.($|[^0-9]))'
            grep -Eq "OpenCASCADE Technology \(OCCT\) $v$vend" notice.txt || { echo "the notice in the $target archive does not name OCCT $occt (Cargo.lock) in its introduction"; exit 1; }
            grep -Eq "\"occt-sys\" $v$vend" notice.txt || { echo "the source offer in the $target archive does not name occt-sys $occt (Cargo.lock)"; exit 1; }
          }
          check x86_64-unknown-linux-gnu tar.gz ""
          check aarch64-apple-darwin tar.gz ""
          check x86_64-pc-windows-msvc zip .exe
          count=$(find dist -maxdepth 1 -type f -name "$NAME-*" | wc -l)
          [ "$count" -eq 4 ] || { echo "expected 4 files (3 archives and the examples zip), found $count"; exit 1; }
          unzip -tq "dist/$NAME-examples.zip"
          echo "The three archives and the examples zip are complete, with the STEP reader and the OpenCASCADE notice (OCCT $occt)." >> "$GITHUB_STEP_SUMMARY"

  # The application release: a GitHub release (not a pre-release) for the existing app-v tag.
  publish-app:
    name: Publish the application release
    # `docs`: a release whose user guide fails its checks is not published (decision 0400 section R).
    needs: [plan, gate, archives, check-archives, docs]
    if: needs.plan.outputs.app == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.plan.outputs.name }}-*
          merge-multiple: true
          skip-decompress: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          NAME: ${{ needs.plan.outputs.name }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            echo "::error::A release for $TAG exists already; nothing was changed."
            exit 1
          fi
          notice=$(perl -0777 -ne 'if (/VERIFY_GCODE_NOTICE: &str = "(.*?)";/s) { $s = $1; $s =~ s/\\\n\s*//g; print $s }' crates/openchuck-types/src/notice.rs)
          [ -n "$notice" ] || { echo "could not read the G-code notice"; exit 1; }
          {
            echo "OpenChuckCAM $VERSION, built from $SHA."
            echo
            echo "**$notice**"
            echo
            echo "This release passed the release gate: the dependency rules, cargo deny, the golden G-code comparison and the LinuxCNC replay."
            echo
            echo "Makera Z1 machine values that have not been confirmed on the machine are labelled unconfirmed in the application. The Z1 air cut is a manual release step, recorded in the project's decision records (decision 0106)."
            echo
            echo "Each archive holds \`openchuck-cli\`, the desktop application (\`openchuck-ui\`; on macOS \`OpenChuckCAM.app\`), the STEP reader, the licences, the third-party notices, the tool data credits and a README. \`$NAME-examples.zip\` holds the example projects."
            echo
            echo "**The programs are not signed or notarised.** macOS blocks them the first time and Windows SmartScreen may warn; the README in each archive says how to open them. The Linux archive's README names the oldest glibc it needs; the macOS archive is for Apple silicon only."
          } > notes.md
          # Upload to a draft first, so the release appears only once it holds all three archives.
          gh release create "$TAG" dist/"$NAME"-* -R "$REPO" --verify-tag --draft \
            --title "OpenChuckCAM $VERSION" --notes-file notes.md
          assets=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets | length')
          [ "$assets" -eq 4 ] || { echo "the draft holds $assets files, expected 4 (3 archives and the examples zip); it is left as a draft"; exit 1; }
          gh release edit "$TAG" -R "$REPO" --draft=false --prerelease=false
          echo "Published the release $TAG." >> "$GITHUB_STEP_SUMMARY"

  # The user guide for this release (decision 0400 sections R and V): built at the tag, stamped with
  # its version, and checked by .github/actions/user-docs as the pull request check does, plus the
  # release checks (a release-notes section for the version, the stamp, and tutorial screenshots no
  # older than the last change to the screens). On a publishing run a failure stops the release
  # (publish-app needs this job); on a dry run it is reported and the run goes on.
  docs:
    name: User guide for the release
    needs: [plan, gate]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and check
        id: guide
        uses: ./.github/actions/user-docs
        continue-on-error: ${{ needs.plan.outputs.publish != 'true' }}
        with:
          mode: release
          version: ${{ needs.plan.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.guide.outcome == 'success'
        with:
          name: user-guide-${{ needs.plan.outputs.version }}
          path: ${{ steps.guide.outputs.guide }}
          if-no-files-found: error

  # Adds the release's user guide to the publish-only branch docs-releases (decision 0400 section V),
  # after the program release is published. This is the only job that writes that branch, and the
  # only one that uses the `docs-release` environment: it holds the client ID and private key of the
  # project's GitHub App, the ruleset's only bypass actor on docs-releases, and only app-v* tags may
  # use it (docs/releasing.md, One-time setup for the documentation site). The token lasts an hour
  # and can only write repository contents. A version already on the branch is never replaced.
  # docs-site.yml then redeploys the site (it runs after every successful Release run); it only
  # reads docs-releases, in the separate `github-pages` environment.
  publish-docs:
    name: Publish the release's user guide
    needs: [plan, docs, publish-app]
    if: needs.plan.outputs.app == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: docs-release
    permissions:
      contents: write
    steps:
      - name: Is the documentation release set up?
        env:
          CLIENT_ID: ${{ vars.DOCS_RELEASE_APP_CLIENT_ID }}
          KEY: ${{ secrets.DOCS_RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$CLIENT_ID" ] || missing="the variable DOCS_RELEASE_APP_CLIENT_ID"
          [ -n "$KEY" ] || missing="${missing:+$missing and }the secret DOCS_RELEASE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=User guide not published::The docs-release environment has no $missing. The program release is published; its user guide is not. Do the one-time setup in docs/releasing.md (One-time setup for the documentation site), then re-run this job."
            exit 1
          fi
      - name: Get a token from the docs release App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: user-guide-${{ needs.plan.outputs.version }}
          path: guide
      - name: Add the guide to docs-releases
        id: add
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          # `--exit-code` gives 2 when the branch is absent (the first release creates it); any
          # other failure stops the job rather than start a new branch beside an existing one.
          set +e
          git ls-remote --exit-code --heads "$url" docs-releases > /dev/null
          found=$?
          set -e
          if [ "$found" -ne 0 ] && [ "$found" -ne 2 ]; then
            echo "::error::Could not read the docs-releases branch (git ls-remote exit $found); nothing was published."
            exit 1
          fi
          if [ "$found" -eq 0 ]; then
            git clone --quiet --depth 1 --branch docs-releases "$url" branch
          else
            echo "No docs-releases branch yet: this first release creates it."
            git init --quiet branch
            git -C branch checkout --quiet --orphan docs-releases
            git -C branch remote add origin "$url"
            printf '%s\n' "# Released versions of the OpenChuckCAM user guide" "" \
              "Built HTML only, one folder per application release, each with a MANIFEST.sha256." \
              "Only the release workflow writes this branch (decision 0400); the source is user-docs/ on main." > branch/README.md
          fi
          python3 source/user-docs/tools/assemble.py add-release --built guide --branch branch --version "$VERSION"
          cd branch
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "User guide for $TAG, built from $SHA"
          git push --quiet origin HEAD:docs-releases
          echo "The user guide for $TAG is on docs-releases." >> "$GITHUB_STEP_SUMMARY"
      - name: Note the guide's manifest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIGEST: ${{ steps.add.outputs.manifest_sha256 }}
        run: |
          gh release view "$TAG" -R "$REPO" --json body --jq .body > notes.md
          {
            echo
            echo "The user guide for this release is the folder \`v$VERSION/\` of the \`docs-releases\` branch. The SHA-256 of its \`MANIFEST.sha256\` is \`$DIGEST\`."
          } >> notes.md
          gh release edit "$TAG" -R "$REPO" --notes-file notes.md

  # The library family: a publish dry run of the four crates together (cargo resolves their
  # dependencies on each other locally). `publish-crates` below publishes them, only when asked.
  library:
    name: Library publish dry run
    needs: [plan, gate]
    if: needs.plan.outputs.lib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: library-publish
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked -p openchuck-types -p openchuck-gcode -p openchuck-path -p openchuck-post
      - name: Summary
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          CRATES: ${{ needs.plan.outputs.crates }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          {
            echo "The library family passes the publish dry run."
            if [ "$PUBLISH" = "true" ] && [ "$CRATES" != "true" ]; then
              echo
              echo "$TAG passed the release gate. The crates were not published: run this workflow by hand on $TAG with dry_run unticked and publish_crates ticked (decision 0138, docs/releasing.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the library family to crates.io (decision 0138, OI-303). It runs only for a manual
  # run on a lib-v tag with dry_run unticked and publish_crates ticked, after the gate and the dry
  # run pass, and only with the CARGO_REGISTRY_TOKEN secret. The `crates-io` environment lets the
  # owner add a required reviewer, so a run waits for approval before it publishes. The crates go
  # in dependency order; a crate already on crates.io at this version is skipped, so a run that
  # stopped part way can be run again. Publishing cannot be undone (a version can only be yanked).
  publish-crates:
    name: Publish the library family to crates.io
    needs: [plan, gate, library]
    if: needs.plan.outputs.lib == 'true' && needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set; nothing was published (docs/releasing.md)."
            exit 1
          fi
          # openchuck-types first: the other three depend on it and on nothing else in the family.
          for crate in openchuck-types openchuck-gcode openchuck-path openchuck-post; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "OpenChuckCAM release workflow (https://github.com/$REPO)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = "200" ]; then
              echo "$crate $VERSION is on crates.io already; skipped." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            cargo publish --locked -p "$crate"
            echo "Published $crate $VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "The library family $VERSION ($TAG) is on crates.io." >> "$GITHUB_STEP_SUMMARY"

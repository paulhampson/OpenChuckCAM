# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the LinuxCNC image that CI uses for gate 3 and any other task that needs
# LinuxCNC (docker/linuxcnc/Dockerfile; OI-47). On main (or by hand) it is pushed to
# the GitHub container registry; on a pull request it is only built, to prove the
# Dockerfile still works. Rebuilt monthly for base image security updates.
name: LinuxCNC image

on:
  pull_request:
    paths:
      - 'docker/linuxcnc/**'
      - '.github/workflows/linuxcnc-image.yml'
  push:
    branches: [main]
    paths:
      - 'docker/linuxcnc/**'
      - '.github/workflows/linuxcnc-image.yml'
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build the LinuxCNC image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/openchuckcam-linuxcnc:2.9.10" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/${owner}/openchuckcam-linuxcnc:2.9.10" docker/linuxcnc
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE" rs274 --help 2>&1 | head -3 || true
          docker run --rm "$IMAGE" bash -c 'test -x /opt/linuxcnc/bin/rs274 && test -e /opt/linuxcnc/rtlib/trivkins.so'
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes the user guide in user-docs/ to GitHub Pages (decision 0400, NFR-19).
#
# "latest" is the nightly build: it is deployed only after a Nightly build run that published the
# rolling `nightly` pre-release, and it is built from the commit of the `nightly` tag, stamped with
# that build's date. Nothing is deployed on a push to main. After a Release run (which may have added
# a version to the docs-releases branch), or by hand, the site is redeployed the same way: latest/
# from the `nightly` tag beside every released version, each checked against its manifest.
#
# Two environments, two jobs, two different powers:
# - `github-pages` (this workflow's deploy job): deploys the Pages site. Its deployment branch rule
#   is main only; a workflow_run or a manual run on main runs with GITHUB_REF = main, so it is
#   admitted. This workflow only READS docs-releases and never writes it.
# - `docs-release` (release.yml's publish-docs job only): the only writer of docs-releases, through
#   the GitHub App whose credentials only that environment holds; app-v* tags only.
#
# The pull request check of the guide is the `docs` job of ci.yml, part of `CI required checks`.
# Both use .github/actions/user-docs, so what is checked is what is published.
name: Docs site

on:
  workflow_run:
    workflows: [Nightly build, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the user guide for Pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # To see whether the Nightly build run that triggered this one published the pre-release.
      actions: read
    outputs:
      publish: ${{ steps.nightly.outputs.publish }}
    steps:
      - name: Which nightly build does "latest" describe?
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TRIGGER: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ] && [ "$TRIGGER" = "Nightly build" ]; then
            published=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Publish the nightly pre-release" and .conclusion == "success")] | length')
            if [ "$published" != 1 ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "The Nightly build run published no new pre-release (no change, or not main); the guide is not redeployed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if ! gh release view nightly -R "$REPO" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=User guide not published::There is no nightly pre-release yet, and \"latest\" is the nightly build."
            exit 0
          fi
          date=$(gh release view nightly -R "$REPO" --json publishedAt --jq '.publishedAt[0:10]')
          {
            echo "publish=true"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.nightly.outputs.publish == 'true'
        with:
          persist-credentials: false
          ref: refs/tags/nightly
          fetch-depth: 0
      - name: Fetch the released versions
        id: releases
        if: steps.nightly.outputs.publish == 'true'
        run: |
          # The publish-only branch; it does not exist until the first application release.
          if git ls-remote --exit-code --heads origin docs-releases > /dev/null; then
            git fetch --depth 1 origin docs-releases
            git worktree add --detach "$RUNNER_TEMP/releases" FETCH_HEAD
            echo "dir=$RUNNER_TEMP/releases" >> "$GITHUB_OUTPUT"
          else
            echo "No docs-releases branch yet: the site has the nightly build only."
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and check
        id: guide
        if: steps.nightly.outputs.publish == 'true'
        uses: ./.github/actions/user-docs
        with:
          mode: nightly
          nightly-date: ${{ steps.nightly.outputs.date }}
          releases: ${{ steps.releases.outputs.dir }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.nightly.outputs.publish == 'true'
        with:
          path: ${{ steps.guide.outputs.site }}

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is GitHub Pages switched on?
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Not published
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=User guide not published::GitHub Pages is not switched on for this repository. The owner sets Settings, Pages, Source to GitHub Actions (docs/releasing.md, One-time setup for the documentation site). The guide was built and checked; nothing else is affected."
      - name: Deploy
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

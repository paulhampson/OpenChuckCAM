# SP-1 option B prototype: our own thin C ABI over OpenCASCADE, with no opencascade-sys.
# Does it build and pass the closed-form checks on Windows (MSVC), macOS and Linux, and does
# process isolation turn reader crashes into clean errors on each? Spike branch only; never merged.
name: sp1-shim
on:
  push:
    branches: [spike/sp-1-step-kernel]
    paths: [spikes/sp1-shim/**, spikes/sp1-step/fixtures/**, .github/workflows/sp1-shim.yml]
  workflow_dispatch:
jobs:
  shim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: spikes/sp1-shim
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: rustc --version; cmake --version | head -1
      - uses: actions/cache/restore@v4
        with:
          path: |
            spikes/sp1-shim/target
            ~/.cargo/registry
          key: sp1-shim-${{ matrix.os }}-${{ hashFiles('spikes/sp1-shim/Cargo.lock', 'spikes/sp1-shim/build.rs') }}
      - name: Build (OpenCASCADE from source, then our shim; one pass, no ordering tricks)
        run: |
          start=$(date +%s)
          set +e
          cargo build --release > build.log 2>&1; rc=$?
          echo "BUILD_SECONDS=$(( $(date +%s) - start )) rc=$rc"
          if [ $rc -ne 0 ]; then grep -n -a -i "error\|warning: unused\|C[0-9][0-9][0-9][0-9]\|undefined" build.log | tail -80; exit 1; fi
      # Save the (slow) OpenCASCADE build even when a later step fails.
      - uses: actions/cache/save@v4
        with:
          path: |
            spikes/sp1-shim/target
            ~/.cargo/registry
          key: sp1-shim-${{ matrix.os }}-${{ hashFiles('spikes/sp1-shim/Cargo.lock', 'spikes/sp1-shim/build.rs') }}
      - name: Closed-form self test
        run: SP1_DIAG=1 ./target/release/sp1-shim selftest ../sp1-step/fixtures
      - name: Exit-crash diagnosis (first macOS run passed every check, then segfaulted)
        if: always()
        run: |
          F=../sp1-step/fixtures
          for v in "" SP1_LEAK=1 SP1_NOQUIET=1 SP1_FASTEXIT=1; do
            rc=0; env SP1_DIAG=1 $v ./target/release/sp1-shim selftest $F > /tmp/o 2>&1 || rc=$?
            echo "variant [${v:-none}] rc=$rc last: $(tail -2 /tmp/o | tr '\n' '|')"
          done
          for args in "walk $F/box.step" "walk $F/sphere.step --tess" "walk $F/filleted_box.step --tess"; do
            rc=0; ./target/release/sp1-shim $args > /dev/null 2>&1 || rc=$?; echo "$args rc=$rc"
          done
          if command -v lldb > /dev/null; then
            lldb --batch -o run -o "bt 40" -o quit -- ./target/release/sp1-shim selftest $F 2>&1 | grep -v "^PASS" | tail -60
          fi
      - name: Walk all fixtures (digests to compare across platforms)
        if: always()
        run: |
          for f in ../sp1-step/fixtures/*.step; do
            echo "$(basename $f) $(./target/release/sp1-shim walk $f --tess | grep -a 'digest\|^tess' | tr '\n' ' ')"
          done
      - name: Full report for the drilled blank
        if: always()
        run: ./target/release/sp1-shim walk ../sp1-step/fixtures/rotary_blank_drilled.step --tess
      - name: Process isolation over the crash and malformed corpus
        if: always()
        run: ./target/release/sp1-shim isolate ../sp1-step/fixtures/crash/*.step ../sp1-step/fixtures/bad/*.step ../sp1-step/fixtures/cylinder.step
      - name: Control - relink with the old toolkit-first order and repeat (macOS, Windows)
        if: always() && runner.os != 'Linux'
        run: |
          SP1_LIB_ORDER=toolkit-first cargo build --release > relink.log 2>&1 || { tail -20 relink.log; exit 1; }
          rc=0; ./target/release/sp1-shim selftest ../sp1-step/fixtures > /tmp/o 2>&1 || rc=$?
          echo "toolkit-first order: selftest rc=$rc ($(tail -1 /tmp/o))"

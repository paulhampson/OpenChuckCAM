# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Seeds and refreshes the cached OpenCASCADE install that the STEP kernel jobs restore (decision
# 0039, OI-169; the action is .github/actions/occt). A cache written by a pull request run is read
# by that pull request only, and GitHub drops a cache nobody used for 7 days. Running here on
# `main` every day writes the cache every pull request can read and keeps it alive: a hit costs
# about a minute, a miss builds OpenCASCADE once (23 to 35 minutes) and saves it.
name: OpenCASCADE cache

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/actions/occt/**"
      - ".github/workflows/occt-cache.yml"
      - "Cargo.toml"
  # Changing the action or this file is checked on the pull request (its cache is its own).
  pull_request:
    paths:
      - ".github/actions/occt/**"
      - ".github/workflows/occt-cache.yml"

permissions:
  contents: read

concurrency:
  group: occt-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CMake 4 on the Windows and macOS runners rejects OpenCASCADE 7.8.1's
  # cmake_minimum_required (decision 0003).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  occt:
    name: OpenCASCADE install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Seeds the cache the STEP kernel job reads, so it runs on the same pinned image
          # (decision 0251, OI-1003); the cache key carries the image.
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: occt
        uses: ./.github/actions/occt
      - name: Report
        shell: bash
        run: echo "cache hit = ${{ steps.occt.outputs.cache-hit }}"

  # The sanitizer variant (nightly.yml, "AddressSanitizer on the STEP wrapper"). It is a different
  # install: the job's CXXFLAGS instrument OpenCASCADE itself, so it has its own key
  # (`occt-<version>-Linux-X64-asan-r1`). A nightly run reads only caches written on its own ref,
  # and the nightly runs on `main`, so this job (also on `main`) is what lets it restore in about
  # two seconds instead of rebuilding for about 39 minutes (OI-272). The environment and the build
  # command are those of the nightly job, so the install written here is the one it restores. It is
  # left out of pull request runs: a miss there would spend the 39 minutes on a cache that only
  # that pull request could read, and the build command is the one nightly.yml already runs.
  occt-asan:
    name: OpenCASCADE install (ubuntu-latest, asan)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ASAN_OPTIONS: detect_leaks=0
      RUSTFLAGS: -Zsanitizer=address
      CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
      CARGO_TARGET_DIR: target/asan
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal -c rust-src
      - id: occt
        uses: ./.github/actions/occt
        with:
          variant: asan
          build-command: cargo +nightly build -Zbuild-std --target $TARGET -p openchuck-import --features kernel --lib
      - name: Report
        shell: bash
        run: echo "cache hit = ${{ steps.occt.outputs.cache-hit }}"

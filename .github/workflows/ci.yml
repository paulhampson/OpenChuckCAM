# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Pull request and main-branch CI (work breakdown slice 0 items 5 and 13;
# verification plan sections 7 to 9). Jobs are path-filtered: a change to
# docs/ alone does not rebuild the Rust workspace (posts/ and testdata/ do, because
# the golden G-code tests read them).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CMake 4 on the Windows and macOS runners rejects OpenCASCADE 7.8.1's
  # cmake_minimum_required; needed once openchuck-import builds the kernel
  # (decision 0003, slice 11).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      records: ${{ steps.filter.outputs.records }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      step: ${{ steps.filter.outputs.step }}
      gate3: ${{ steps.filter.outputs.gate3 }}
      linuxcnc_image: ${{ steps.filter.outputs.linuxcnc_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'xtask/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'posts/**'
              - 'testdata/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'about.toml'
              - 'about.hbs'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/**'
            # The STEP kernel build (decision 0003): only what can change the wrapper, its
            # inputs or what is compared with it. A docs or posts change never gets here.
            step:
              - 'crates/openchuck-import/**'
              - 'crates/openchuck-types/**'
              - 'crates/openchuck-path/**'
              - 'crates/openchuck-app/**'
              - 'testdata/step/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/occt/**'
            records:
              - 'docs/requirements.md'
              - 'docs/work-breakdown.md'
              - 'docs/dependencies.md'
              - 'testdata/**'
            gate3:
              - 'crates/openchuck-types/**'
              - 'crates/openchuck-post/**'
              - 'crates/openchuck-gcode/**'
              - 'crates/openchuck-app/**'
              - 'apps/openchuck-cli/**'
              - 'posts/**'
              - 'testdata/golden/**'
              - 'tools/linuxcnc/**'
              - 'docker/linuxcnc/**'
              - 'xtask/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            linuxcnc_image:
              - 'docker/linuxcnc/**'
            fuzz:
              - 'fuzz/**'
              - 'crates/openchuck-gcode/**'
              - 'crates/openchuck-post/**'
              - 'posts/**'
              - 'crates/openchuck-types/**'
              - 'crates/openchuck-project/**'
              - 'crates/openchuck-geom/**'
              - 'crates/openchuck-import/**'
              - 'testdata/stl/**'

  gate3:
    name: Gate 3 (LinuxCNC simulator)
    needs: changes
    if: needs.changes.outputs.gate3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      # Built from docker/linuxcnc by the linuxcnc-image workflow; if it has not been
      # published yet (or the Dockerfile changed in this pull request) it is built here.
      LINUXCNC_IMAGE: ghcr.io/paulhampson/openchuckcam-linuxcnc:2.9.10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Get the LinuxCNC image
        env:
          IMAGE_CHANGED: ${{ needs.changes.outputs.linuxcnc_image }}
        run: |
          if [ "$IMAGE_CHANGED" = "true" ]; then
            docker build -t "$LINUXCNC_IMAGE" docker/linuxcnc
          else
            docker pull "$LINUXCNC_IMAGE" || docker build -t "$LINUXCNC_IMAGE" docker/linuxcnc
          fi
      # Every LinuxCNC golden program runs in the headless XYZA simulator and is compared
      # with the replay of the same file (verification plan section 6, gate 3).
      - name: Replay the golden programs in LinuxCNC
        run: cargo xtask replay --docker "$LINUXCNC_IMAGE" --keep-reports target/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate3-reports
          path: target/replay
          if-no-files-found: ignore

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy (deny warnings, unwrap and unchecked indexing)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Doctests
        run: cargo test --workspace --doc --locked
      - name: Examples run
        run: |
          cargo run --locked -p openchuck-types --example kinematics
          cargo run --locked -p openchuck-geom --example check_and_place
          cargo run --locked -p openchuck-path --example host

  ui-smoke:
    name: UI smoke test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # UI-01, NFR-02 and verification plan 4.2: render offscreen and launch the
    # application, software-rendered where the runner has no GPU (decision
    # 0029, OI-129). Linux uses Mesa's lavapipe under Xvfb and must find an
    # adapter. Windows (WARP) and macOS (the runner's Metal device) are not
    # yet proven on hosted runners, so they report without blocking until
    # their first runs are recorded under OI-129.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require_adapter: "1"
            blocking: true
          - os: windows-latest
            require_adapter: ""
            blocking: false
          - os: macos-latest
            require_adapter: ""
            blocking: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}
    timeout-minutes: 30
    env:
      OPENCHUCK_REQUIRE_ADAPTER: ${{ matrix.require_adapter }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # xvfb-run needs xauth, which the xvfb package only recommends.
          # winit loads libxkbcommon-x11 (and may load the other X11 client
          # libraries) at run time; the bare runner lacks them.
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth \
            libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 libxcursor1 libxrandr2 libxi6
      - name: Viewport render tests
        shell: bash
        run: |
          if [ -z "$OPENCHUCK_REQUIRE_ADAPTER" ]; then unset OPENCHUCK_REQUIRE_ADAPTER; fi
          cargo test --locked -p openchuck-viewport --test render -- --nocapture
      - name: Launch the application (3 s scripted camera path)
        shell: bash
        run: |
          cargo build --locked -p openchuck-ui
          run() { "$@" ./target/debug/openchuck-ui --bench testdata/stl/cube_ascii.stl --seconds 3; }
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            run xvfb-run -a -s "-screen 0 1920x1080x24" > launch.log 2>&1
          else
            run > launch.log 2>&1
          fi
          code=$?
          set -e
          cat launch.log
          # 0 passes and 2 fails the frame-time limit; either means the
          # window opened, drew and closed. Anything else is a failure, and
          # the end of the output becomes an annotation on the check page.
          echo "exit code $code"
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then
            tail -n 25 launch.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{ printf "%s%%0A", $0 }' > tail.txt
            echo "::error title=UI launch failed (exit $code)::$(cat tail.txt)"
            exit 1
          fi

  # OpenCASCADE 7.8.1 is built from source by occt-sys (cold: 8 to 9 min on macOS arm64, 32 to 51 min
  # on Linux, 48 to 71 min on Windows, decision 0003), so the finished install is cached per platform
  # on its own (.github/actions/occt, decision 0035) and saved even when a later step fails. The job runs only when a change can affect the wrapper. The other
  # jobs exclude the kernel: it is behind the `kernel` feature of openchuck-import.
  step-kernel:
    name: STEP kernel (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.step == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # OpenCASCADE comes from its own cache (decision 0035), keyed on the occt-sys version, so a
      # manifest change no longer rebuilds it; rust-cache keeps the Rust dependencies.
      - uses: ./.github/actions/occt
      - uses: Swatinem/rust-cache@v2
        with:
          key: step-kernel
          cache-on-failure: true
      - name: Tool versions
        shell: bash
        run: rustc --version; cmake --version | head -1
      - name: Build the kernel, the wrapper and the worker
        run: cargo build --locked -p openchuck-import --features kernel --bins
      - name: clippy on the wrapper (deny warnings)
        run: cargo clippy --locked -p openchuck-import --features kernel --all-targets -- -D warnings
      # Import, numbering, units, tessellation, the corpus, the crash and malformed files, and the
      # worker exiting cleanly (the link order contract of decision 0003).
      - name: Import tests
        run: cargo test --locked -p openchuck-import --features kernel
      # Exact evaluation against the kernel itself (decision 0017: the SP-9 comparison, kept).
      - name: Exact surfaces against the kernel
        run: cargo test --locked -p openchuck-app --features kernel-tests --test step_exact
      - name: Mutation run through the importer (NFR-07)
        run: cargo run --locked -p openchuck-import --features kernel --example step_mutations -- 150

  libraries-alone:
    name: Each library alone (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # The library family builds and tests on its own, without the C++
      # toolchain, GPU libraries or application crates (architecture section 12).
      - name: Build each library crate on its own
        run: >
          cargo hack check --no-dev-deps
          --package openchuck-types --package openchuck-path
          --package openchuck-post --package openchuck-gcode
          --package openchuck-geom --package openchuck-sim --package openchuck-project
      - name: Test each library-family crate on its own
        shell: bash
        run: |
          for crate in openchuck-types openchuck-path openchuck-post openchuck-gcode; do
            cargo test --locked -p "$crate"
          done

  repository-checks:
    name: Repository checks (xtask)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.records == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Dependency rules (architecture sections 4 and 12)
        run: cargo xtask deps
      - name: SPDX headers and crate licences (NFR-10)
        run: cargo xtask licences
      - name: Dependency pins and records (NFR-14)
        run: cargo xtask records
      - name: Test-data size policy
        run: cargo xtask testdata
      - name: Traceability report
        run: cargo xtask trace --report target/traceability.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traceability-report
          path: target/traceability.md

  cargo-deny:
    name: cargo deny (licences, advisories, sources)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cargo-audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  licence-notices:
    name: Licence notices (cargo about)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked about.hbs > THIRD-PARTY-NOTICES.html
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.html

  semver:
    name: Semver check (library family)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # Compares the public API with the pull request's base (INT-07). Crates
      # that do not exist on the base yet are skipped.
      - name: cargo semver-checks
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for crate in openchuck-types openchuck-path openchuck-post openchuck-gcode; do
            if git cat-file -e "$BASE:crates/$crate/Cargo.toml" 2>/dev/null; then
              cargo semver-checks --package "$crate" --baseline-rev "$BASE"
            else
              echo "$crate is new in this change; no baseline"
            fi
          done

  fuzz-smoke:
    name: Fuzz smoke (1 minute per target)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [machine_profile_json, machine_profile_toml, toolpath_ir_json, project_files, stl_import, tool_library_toml, tool_profile_toml, gcode_reader, post_definition]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed the STL corpus from testdata
        if: matrix.target == 'stl_import'
        run: mkdir -p fuzz/corpus/stl_import && cp testdata/stl/*.stl fuzz/corpus/stl_import/
      - name: Seed the machine profile corpus from the built-in profiles
        if: matrix.target == 'machine_profile_toml'
        run: mkdir -p fuzz/corpus/machine_profile_toml && cp crates/openchuck-project/machines/*.toml fuzz/corpus/machine_profile_toml/
      - name: Seed the tool library corpus
        if: matrix.target == 'tool_library_toml'
        run: mkdir -p fuzz/corpus/tool_library_toml && cp testdata/tools/library/*.toml testdata/tools/library/tool-sets/*.toml testdata/tools/broken/*.toml fuzz/corpus/tool_library_toml/
      - name: Seed the tool profile corpus
        if: matrix.target == 'tool_profile_toml'
        run: mkdir -p fuzz/corpus/tool_profile_toml && cp testdata/tools/profiles/*.toml fuzz/corpus/tool_profile_toml/
      - name: Seed the G-code corpus
        if: matrix.target == 'gcode_reader'
        run: mkdir -p fuzz/corpus/gcode_reader && cp testdata/gcode/*.ngc testdata/golden/post_*.ngc testdata/golden/reference/*.ngc testdata/golden/reference/*.nc fuzz/corpus/gcode_reader/
      - name: Seed the post definition corpus
        if: matrix.target == 'post_definition'
        run: |
          mkdir -p fuzz/corpus/post_definition
          for d in posts/*/; do { cat "$d/post.toml"; printf '\n---\n'; cat "$d/main.post"; } > "fuzz/corpus/post_definition/$(basename "$d")"; done
      - name: Fuzz for one minute
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set +e
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=60 > fuzz.log 2>&1
          code=$?
          set -e
          cat fuzz.log
          # On failure, the end of the output becomes an annotation on the
          # check page, so the cause is visible without opening the log.
          if [ "$code" != 0 ]; then
            tail -n 25 fuzz.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{ printf "%s%%0A", $0 }' > tail.txt
            echo "::error title=Fuzz $TARGET failed (exit $code)::$(cat tail.txt)"
            exit "$code"
          fi

  coverage:
    name: Coverage trend
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # The repository tooling (xtask) is not product code; keep it out of every report.
      COV_IGNORE: 'xtask/'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Run the tests once, then render each report format from that run. nextest
      # schedules tests from every binary in parallel, one process each; plain
      # `cargo test` ran the binaries one after another, and the two heavy path
      # binaries (helical, unroll) alone took about 17 of the job's 20 minutes.
      # Doctests are not part of this run (llvm-cov nextest does not run them).
      # The `coverage` profile (.config/nextest.toml) leaves out the long-running
      # tests: instrumentation makes them 6 to 11 times slower and one test cannot
      # be split across cores. The Tests job runs all of them, and the nightly run
      # repeats them.
      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov nextest --profile coverage --workspace --locked --no-report
      - name: HTML report (browsable, per file and per line)
        run: cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --html --output-dir target/coverage
      - name: lcov data (trend tracking)
        run: cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --lcov --output-path lcov.info
      - name: Summary on the run page
        shell: bash
        run: |
          {
            echo '## Coverage'
            echo
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE"
            echo '```'
            echo
            echo 'The full per-line HTML report is in the `coverage-html` artifact (open `html/index.html`).'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # The single status to require in the branch ruleset for `main` ("CI required checks").
  # Path filtering skips jobs, and GitHub treats a skipped job as passing, but a
  # required status that never reports blocks the merge. Requiring this one job
  # avoids listing every job (and every matrix leg) in the ruleset. It always
  # runs, fails if any job it needs failed or was cancelled, and accepts a
  # skipped job only because a path filter or event condition turned it off.
  # `changes` itself must succeed: if it fails, every other job is skipped and
  # the filter result is unknown, so that must not read as a pass.
  # To make a new job required, add it to `needs:` here; to make one advisory,
  # remove it.
  required:
    name: CI required checks
    if: always()
    needs:
      - changes
      - gate3
      - fmt
      - build-test
      - ui-smoke
      - step-kernel
      - libraries-alone
      - repository-checks
      - cargo-deny
      - cargo-audit
      - licence-notices
      - semver
      - fuzz-smoke
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check the required jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != "success" ]; then
            echo "::error::The change-detection job did not succeed, so skipped jobs cannot be trusted"
            exit 1
          fi
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"')
          if [ -n "$bad" ]; then
            echo "::error title=Required jobs did not pass::$(echo "$bad" | paste -sd, -)"
            exit 1
          fi
          echo "All required jobs passed or were skipped by their path filters."

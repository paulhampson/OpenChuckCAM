# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Pull request and main-branch CI (work breakdown slice 0 items 5 and 13;
# verification plan sections 7 to 9). Jobs are path-filtered: a change to
# docs/ alone does not rebuild the Rust workspace (posts/ and testdata/ do, because
# the golden G-code tests read them).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CMake 4 on the Windows and macOS runners rejects OpenCASCADE 7.8.1's
  # cmake_minimum_required; needed once openchuck-import builds the kernel
  # (decision 0003, slice 11).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      records: ${{ steps.filter.outputs.records }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      gate3: ${{ steps.filter.outputs.gate3 }}
      linuxcnc_image: ${{ steps.filter.outputs.linuxcnc_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'xtask/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'posts/**'
              - 'testdata/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'about.toml'
              - 'about.hbs'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/**'
            records:
              - 'docs/requirements.md'
              - 'docs/work-breakdown.md'
              - 'docs/dependencies.md'
              - 'testdata/**'
            gate3:
              - 'crates/openchuck-types/**'
              - 'crates/openchuck-post/**'
              - 'crates/openchuck-gcode/**'
              - 'crates/openchuck-app/**'
              - 'apps/openchuck-cli/**'
              - 'posts/**'
              - 'testdata/golden/**'
              - 'tools/linuxcnc/**'
              - 'docker/linuxcnc/**'
              - 'xtask/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            linuxcnc_image:
              - 'docker/linuxcnc/**'
            fuzz:
              - 'fuzz/**'
              - 'crates/openchuck-gcode/**'
              - 'crates/openchuck-post/**'
              - 'posts/**'
              - 'crates/openchuck-types/**'
              - 'crates/openchuck-project/**'
              - 'crates/openchuck-geom/**'
              - 'crates/openchuck-import/**'
              - 'testdata/stl/**'

  gate3:
    name: Gate 3 (LinuxCNC simulator)
    needs: changes
    if: needs.changes.outputs.gate3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      # Built from docker/linuxcnc by the linuxcnc-image workflow; if it has not been
      # published yet (or the Dockerfile changed in this pull request) it is built here.
      LINUXCNC_IMAGE: ghcr.io/paulhampson/openchuckcam-linuxcnc:2.9.10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Get the LinuxCNC image
        env:
          IMAGE_CHANGED: ${{ needs.changes.outputs.linuxcnc_image }}
        run: |
          if [ "$IMAGE_CHANGED" = "true" ]; then
            docker build -t "$LINUXCNC_IMAGE" docker/linuxcnc
          else
            docker pull "$LINUXCNC_IMAGE" || docker build -t "$LINUXCNC_IMAGE" docker/linuxcnc
          fi
      # Every LinuxCNC golden program runs in the headless XYZA simulator and is compared
      # with the replay of the same file (verification plan section 6, gate 3).
      - name: Replay the golden programs in LinuxCNC
        run: cargo xtask replay --docker "$LINUXCNC_IMAGE" --keep-reports target/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate3-reports
          path: target/replay
          if-no-files-found: ignore

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy (deny warnings, unwrap and unchecked indexing)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Doctests
        run: cargo test --workspace --doc --locked
      - name: Examples run
        run: |
          cargo run --locked -p openchuck-types --example kinematics
          cargo run --locked -p openchuck-geom --example check_and_place
          cargo run --locked -p openchuck-path --example host

  libraries-alone:
    name: Each library alone (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # The library family builds and tests on its own, without the C++
      # toolchain, GPU libraries or application crates (architecture section 12).
      - name: Build each library crate on its own
        run: >
          cargo hack check --no-dev-deps
          --package openchuck-types --package openchuck-path
          --package openchuck-post --package openchuck-gcode
          --package openchuck-geom --package openchuck-sim --package openchuck-project
      - name: Test each library-family crate on its own
        shell: bash
        run: |
          for crate in openchuck-types openchuck-path openchuck-post openchuck-gcode; do
            cargo test --locked -p "$crate"
          done

  repository-checks:
    name: Repository checks (xtask)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.records == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Dependency rules (architecture sections 4 and 12)
        run: cargo xtask deps
      - name: SPDX headers and crate licences (NFR-10)
        run: cargo xtask licences
      - name: Dependency pins and records (NFR-14)
        run: cargo xtask records
      - name: Test-data size policy
        run: cargo xtask testdata
      - name: Traceability report
        run: cargo xtask trace --report target/traceability.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traceability-report
          path: target/traceability.md

  cargo-deny:
    name: cargo deny (licences, advisories, sources)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cargo-audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  licence-notices:
    name: Licence notices (cargo about)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked about.hbs > THIRD-PARTY-NOTICES.html
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.html

  semver:
    name: Semver check (library family)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # Compares the public API with the pull request's base (INT-07). Crates
      # that do not exist on the base yet are skipped.
      - name: cargo semver-checks
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for crate in openchuck-types openchuck-path openchuck-post openchuck-gcode; do
            if git cat-file -e "$BASE:crates/$crate/Cargo.toml" 2>/dev/null; then
              cargo semver-checks --package "$crate" --baseline-rev "$BASE"
            else
              echo "$crate is new in this change; no baseline"
            fi
          done

  fuzz-smoke:
    name: Fuzz smoke (1 minute per target)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [machine_profile_json, machine_profile_toml, toolpath_ir_json, project_files, stl_import, tool_library_toml, tool_profile_toml, gcode_reader, post_definition]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed the STL corpus from testdata
        if: matrix.target == 'stl_import'
        run: mkdir -p fuzz/corpus/stl_import && cp testdata/stl/*.stl fuzz/corpus/stl_import/
      - name: Seed the machine profile corpus from the built-in profiles
        if: matrix.target == 'machine_profile_toml'
        run: mkdir -p fuzz/corpus/machine_profile_toml && cp crates/openchuck-project/machines/*.toml fuzz/corpus/machine_profile_toml/
      - name: Seed the tool library corpus
        if: matrix.target == 'tool_library_toml'
        run: mkdir -p fuzz/corpus/tool_library_toml && cp testdata/tools/library/*.toml testdata/tools/library/tool-sets/*.toml testdata/tools/broken/*.toml fuzz/corpus/tool_library_toml/
      - name: Seed the tool profile corpus
        if: matrix.target == 'tool_profile_toml'
        run: mkdir -p fuzz/corpus/tool_profile_toml && cp testdata/tools/profiles/*.toml fuzz/corpus/tool_profile_toml/
      - name: Seed the G-code corpus
        if: matrix.target == 'gcode_reader'
        run: mkdir -p fuzz/corpus/gcode_reader && cp testdata/gcode/*.ngc testdata/golden/post_*.ngc testdata/golden/reference/*.ngc testdata/golden/reference/*.nc fuzz/corpus/gcode_reader/
      - name: Seed the post definition corpus
        if: matrix.target == 'post_definition'
        run: |
          mkdir -p fuzz/corpus/post_definition
          for d in posts/*/; do { cat "$d/post.toml"; printf '\n---\n'; cat "$d/main.post"; } > "fuzz/corpus/post_definition/$(basename "$d")"; done
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60

  coverage:
    name: Coverage trend
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # The repository tooling (xtask) is not product code; keep it out of every report.
      COV_IGNORE: 'xtask/'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Run the tests once, then render each report format from that run. nextest
      # schedules tests from every binary in parallel, one process each; plain
      # `cargo test` ran the binaries one after another, and the two heavy path
      # binaries (helical, unroll) alone took about 17 of the job's 20 minutes.
      # Doctests are not part of this run (llvm-cov nextest does not run them).
      # The `coverage` profile (.config/nextest.toml) leaves out the long-running
      # tests: instrumentation makes them 6 to 11 times slower and one test cannot
      # be split across cores. The Tests job runs all of them, and the nightly run
      # repeats them.
      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov nextest --profile coverage --workspace --locked --no-report
      - name: HTML report (browsable, per file and per line)
        run: cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --html --output-dir target/coverage
      - name: lcov data (trend tracking)
        run: cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --lcov --output-path lcov.info
      - name: Summary on the run page
        shell: bash
        run: |
          {
            echo '## Coverage'
            echo
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE"
            echo '```'
            echo
            echo 'The full per-line HTML report is in the `coverage-html` artifact (open `html/index.html`).'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

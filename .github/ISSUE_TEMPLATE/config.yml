# Issue chooser. The two forms are listed first. Blank issues stay on so the
# maintainer can file tasks and checks by hand, and so a question has a place.
# Discussions is not enabled, so there is no link to it.
blank_issues_enabled: true
contact_links:
  - name: User guide - reporting a problem or asking for a feature
    url: https://paulhampson.github.io/OpenChuckCAM/latest/reporting.html
    about: What to include in a report, what the log file holds, and how to attach it safely.
  - name: User guide - troubleshooting and known limitations
    url: https://paulhampson.github.io/OpenChuckCAM/latest/troubleshooting.html
    about: Questions and how-to - check here first. If the guide does not answer, open a blank issue and start the title with Question:.
